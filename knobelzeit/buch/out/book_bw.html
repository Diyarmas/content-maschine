<script>window.BW=true;window.PART="all";window.DATA={"cases":[{"n":"01","cat":"Verhör","tags":["Brandts Klassiker"],"stars":1,"min":2,"double":false,"hint":false,"title":"Der Kuchendieb","bet":["ANNA","BEN","CARLA","OMA HILDE"],"task":"Wer hat das Stück gegessen?","tip1":"161","tip2":"264","classic":true,"body":[{"t":"p","text":"Oma Hilde hat einen Schokoladenkuchen zum Abkühlen auf die Fensterbank gestellt. Zehn Minuten später fehlt ein großes Stück. In der Küche waren nur Anna, Ben und Carla."},{"t":"stmts","rows":[["Anna","„Ben war's.\""],["Ben","„Ich war's nicht.\""],["Carla","„Ich war's nicht.\""]]},{"t":"p","text":"Herr Brandt weiß: Genau einer von den dreien sagt die Wahrheit."}]},{"n":"02","cat":"Querdenken","tags":[],"stars":1,"min":2,"double":false,"hint":false,"title":"Scherben im Wohnzimmer","bet":["LEA","TOM","MAX","MAMA ELIF"],"task":"Wer hat die Vase zerbrochen, und woran erkennst du das?","tip1":"358","tip2":"363","classic":false,"body":[{"t":"p","text":"Im Wohnzimmer von Familie Yılmaz stehen drei Vasen: eine rote, eine grüne und eine blaue. Als Mama Elif nach Hause kommt, liegt eine davon in Scherben auf dem Boden. Sie fegt alles zusammen, wirft die Scherben weg und stellt die beiden heilen Vasen sicherheitshalber in den Schrank. Dann ruft sie die Kinder in die Küche und fragt nur: „Wer von euch hat die Vase kaputt gemacht?\""},{"t":"stmts","rows":[["Lea","„Ich war den ganzen Nachmittag in meinem Zimmer und hab Hausaufgaben gemacht.\""],["Tom","„Ich war nicht mal in der Nähe der blauen Vase!\""],["Max","„Ich hab draußen mit den Nachbarn Fußball gespielt.\""]]}]},{"n":"03","cat":"Beweisstück","tags":[],"stars":1,"min":3,"double":false,"hint":false,"title":"Wer hat den Döner nicht bezahlt?","bet":["KEMAL","CAN","ALI","PETER","LUIGI"],"task":"Wer hat seinen Döner nicht bezahlt?","tip1":"153","tip2":"215","classic":false,"body":[{"t":"p","text":"Freitagabend, Kemals Dönerladen ist rappelvoll. Kemal steht am Grill, an der Kasse steht heute sein Neffe Can. Als Can kurz in den Keller geht, um Ayran zu holen, ist an Tisch 4 ein Döner gegessen und nicht bezahlt. An Tisch 4 saßen Ali, Peter und Luigi. Luigi, der Pizzabäcker von gegenüber, springt gerade auf und rennt hinaus. Herr Brandt hört sich um:"},{"t":"stmts","rows":[["Ali","„Ich hab bar bezahlt. Hier ist mein Kassenbon.\""],["Peter","„Ich hab vorhin bei Can ganz normal mit Karte gezahlt.\""],["Luigi (ruft von draußen)","„Mein Ofen brennt an! Mein Geld liegt unter dem Teller!\""]]},{"t":"p","text":"Unter Luigis Teller liegen 8 Euro, genau der Preis für Döner und Getränk. An der Kasse hängt seit Montag ein Zettel: „Kartengerät kaputt – nur Bargeld!\""},{"t":"ill","kind":"ill","text":"Kemals Kasse mit dem handgeschriebenen Zettel „Kartengerät kaputt – nur Bargeld!\", daneben der Grill."}]},{"n":"04","cat":"Querdenken","tags":[],"stars":1,"min":2,"double":false,"hint":false,"title":"Stromausfall in der Lindenstraße","bet":["HANS","HERR BRANDT"],"task":"Warum glaubt Herr Brandt Hans nicht?","tip1":"385","tip2":"316","classic":false,"body":[{"t":"p","text":"An jeder Haustür in der Lindenstraße hängt ein Zettel der Stadtwerke: „Mittwoch von 19 bis 21 Uhr kein Strom in der ganzen Lindenstraße.\" Am Mittwoch um 20 Uhr wird im Hinterhof ein Moped gestohlen. Hans wohnt in der Lindenstraße und sagt: „Um acht saß ich zu Hause vorm Fernseher und hab Fußball geguckt. 2:1 ist es ausgegangen, ein Wahnsinnsspiel!\""}]},{"n":"05","cat":"Rechnen","tags":[],"stars":1,"min":3,"double":false,"hint":false,"title":"Omas Fahrradschloss","bet":["OMA HILDE","ANNA"],"task":"Wie lautet die Zahl?","tip1":"381","tip2":"352","classic":false,"body":[{"t":"p","text":"Oma Hilde hat die Zahl für ihr Fahrradschloss vergessen. Zum Glück hat sie einen Zettel, so geschrieben, dass ein Dieb die Zahl nicht sofort erkennt:"},{"t":"p","text":"„Drei verschiedene Ziffern. Die erste ist doppelt so groß wie die letzte. Die mittlere ist die Summe der beiden anderen. Alle drei zusammen ergeben 12.\""}]},{"n":"06","cat":"Verhör","tags":[],"stars":1,"min":2,"double":false,"hint":false,"title":"Dunkelheit im Tunnel","bet":["CARLA","LARS","PETER","EMRE"],"task":"Wer lügt?","tip1":"326","tip2":"223","classic":false,"body":[{"t":"p","text":"Der Zug von Zürich nach Mailand fährt in den Gotthard-Basistunnel. Fast zwanzig Minuten lang ist draußen alles schwarz. Carla ist in dieser Zeit im Speisewagen, ihr Handy liegt am Platz. Als sie zurückkommt, ist es weg. Herr Brandt fragt die drei Mitreisenden an Carlas Vierertisch, was sie in diesen zwanzig Minuten gemacht haben:"},{"t":"stmts","rows":[["Lars","„Ich hab geschlafen, wie die ganze Fahrt schon.\""],["Peter","„Ich war auf der Toilette, gleich am Ende des Wagens.\""],["Emre","„Ich hab die ganze Zeit aus dem Fenster geschaut. Die Berge waren traumhaft!\""]]}]},{"n":"07","cat":"Tatortbild","tags":["HINWEISBILD"],"stars":1,"min":2,"double":false,"hint":true,"title":"Schnee unter dem Auto","bet":["PETER","HERR BRANDT"],"task":"Woran erkennt Herr Brandt, dass Peter lügt?","tip1":"102","tip2":"142","classic":false,"body":[{"t":"p","text":"Heute früh hat es geschneit, von fünf bis acht Uhr. Um halb acht verschwindet am Schulkiosk die Spendendose fürs Tierheim. Um neun Uhr befragt Herr Brandt die Nachbarn. Peter fegt gerade den Schnee vom Dach seines roten Autos."},{"t":"stmts","rows":[["Peter","„Ich war heute noch gar nicht weg. Mein Auto steht seit gestern Abend genau hier.\""]]},{"t":"p","text":"Herr Brandt bückt sich und schaut unter das Auto."},{"t":"ill","kind":"hint","text":"Peters rotes Auto von der Seite. Auf der Straße liegt hoher Schnee, unter dem Auto nur eine dünne Schicht. Auf dem Dach etwas Schnee, Peter mit Besen."}]},{"n":"08","cat":"Querdenken","tags":[],"stars":1,"min":2,"double":false,"hint":false,"title":"Eis in der Hitze","bet":["OMA HILDE","MEHMET","CARLA","HERR BRANDT"],"task":"Wessen Geschichte stimmt nicht?","tip1":"157","tip2":"248","classic":false,"body":[{"t":"p","text":"Sommerfest in Oma Hildes Garten, 34 Grad im Schatten. Um 15 Uhr verschwindet Omas Geldbörse vom Gartentisch. Um 15:20 Uhr kommt Mehmet, der im Haus nebenan wohnt, durchs Gartentor und stellt eine Eispackung aus Pappe auf den Tisch."},{"t":"stmts","rows":[["Mehmet","„Ich komme direkt von der Eisdiele am Bahnhof. Zwanzig Minuten zu Fuß, in der prallen Sonne!\""],["Carla (mit nassen Haaren im Planschbecken)","„Ich war die ganze Zeit hier im Wasser.\""]]},{"t":"p","text":"Herr Brandt drückt auf die Packung. Das Eis ist steinhart."}]},{"n":"09","cat":"Geheimcode","tags":[],"stars":1,"min":2,"double":false,"hint":false,"title":"Der Zettel am Spiegel","bet":["ANNA","BEN"],"task":"Was steht auf dem Zettel?","tip1":"151","tip2":"331","classic":false,"body":[{"t":"p","text":"Anna findet am Badezimmerspiegel einen Zettel von Herrn Brandt:"},{"t":"p","text":"RELLEK MI TGEIL ZTAHCS RED"},{"t":"p","text":"Ben: „Das ist doch Kauderwelsch.\" Anna: „Nein. Herr Brandt schreibt nie etwas einfach von vorne nach hinten.\""}]},{"n":"10","cat":"Querdenken","tags":[],"stars":1,"min":2,"double":false,"hint":false,"title":"Der nasse Regenschirm","bet":["IGOR","LARS","HERR BRANDT"],"task":"Wer sagt nicht die Wahrheit?","tip1":"106","tip2":"390","classic":false,"body":[{"t":"p","text":"Seit genau 14 Uhr regnet es in Strömen. Um 14:15 Uhr verschwindet in der Bäckerei neben der Stadtbibliothek die Trinkgeldkasse. Um 14:30 Uhr findet Herr Brandt in der Bibliothek zwei Männer."},{"t":"stmts","rows":[["Igor (sitzt am Lesetisch, neben ihm lehnt sein Schirm in einer Pfütze)","„Ich sitze seit ein Uhr hier und lese. Ich war keine Minute draußen.\""],["Lars (tropfnass, ohne Schirm)","„Ich bin eben erst aus dem Bus gestiegen und hier reingerannt.\""]]}]},{"n":"11","cat":"Beweisstück","tags":["HINWEISBILD"],"stars":1,"min":3,"double":false,"hint":true,"title":"Grüße aus Mallorca","bet":["DRAGAN","MEHMET","HERR BRANDT"],"task":"Warum glaubt Herr Brandt Dragan nicht?","tip1":"261","tip2":"208","classic":false,"body":[{"t":"p","text":"Am Mittwoch wird in München Mehmets Lieferfahrrad gestohlen. Dragan, sein Nachbar, war schon öfter verdächtig. „Ich war die ganze Woche auf Mallorca\", sagt Dragan. „Am Mittwoch hab ich dir sogar eine Karte geschickt!\" Mehmet holt die Postkarte und dreht sie um."},{"t":"ill","kind":"hint","text":"Vorderseite: Strandfoto „Grüße aus Palma\". Rückseite: „Grüße aus Palma! Dein Dragan\", oben rechts eine Briefmarke der Deutschen Post, Stempel „Briefzentrum 80 · Mittwoch\"."}]},{"n":"12","cat":"Rechnen","tags":[],"stars":1,"min":3,"double":false,"hint":false,"title":"Pizza bei Luigi","bet":["LUIGI","BEN","LEA","TOM"],"task":"Wie viele Stücke hatte Ben wirklich?","tip1":"304","tip2":"229","classic":false,"body":[{"t":"p","text":"Luigi schneidet eine Pizza in 8 Stücke für Ben, Lea und Tom. Am Ende ist kein Stück übrig. Luigi hat zugeschaut und weiß zwei Dinge sicher: Lea hat genau 2 Stücke gegessen. Und Ben hat doppelt so viele genommen wie Tom."},{"t":"stmts","rows":[["Ben","„Ich hatte nur 3 Stücke, ehrlich!\""]]}]},{"n":"13","cat":"Querdenken","tags":["Brandts Klassiker"],"stars":1,"min":2,"double":false,"hint":false,"title":"Der Hund, der nicht bellte","bet":["OMA GRETA","BRUNO (DACKEL)","LARS","MIA","FRANK"],"task":"Wer hat die Gießkanne genommen?","tip1":"279","tip2":"283","classic":true,"body":[{"t":"p","text":"Bruno, Oma Gretas Dackel, bellt jeden an, der nicht zur Familie gehört. Sogar Lars, den Paketboten, der seit fünf Jahren jeden Tag kommt. Heute Nacht um zwei wird Gretas Gießkanne aus Kupfer aus dem Garten geklaut. Greta lag wach und sagt: „Bruno hat keinen Mucks gemacht.\" Drei Leute waren in der Nacht in der Straße unterwegs:"},{"t":"list","kind":"bul","items":["Lars, der Paketbote, auf dem Heimweg vom Nachtdienst.","Mia, die neue Nachbarin, die Bruno noch nie getroffen hat.","Frank, Gretas Sohn, der jedes Wochenende zu Besuch kommt."]}]},{"n":"14","cat":"Tatortbild","tags":["HINWEISBILD"],"stars":1,"min":2,"double":false,"hint":true,"title":"Scherben auf dem Rasen","bet":["HANS","HERR BRANDT"],"task":"Was stimmt an Hans' Geschichte nicht?","tip1":"293","tip2":"396","classic":false,"body":[{"t":"p","text":"Hausmeister Hans ruft aufgeregt an: „Einbruch im Vereinsheim! Ein Dieb hat von draußen das Fenster eingeschlagen, ist eingestiegen und hat die neue Bohrmaschine geklaut!\" Herr Brandt schaut sich um. Im Fensterrahmen stecken noch ein paar Zacken. Herr Brandt sieht sich drinnen und draußen genau um."},{"t":"ill","kind":"hint","text":"Geteiltes Bild. Links das Fenster von draußen, viele Scherben auf dem Rasen. Rechts der Raum von innen, der Boden unter dem Fenster ist sauber."}]},{"n":"15","cat":"Beweisstück","tags":[],"stars":1,"min":2,"double":false,"hint":false,"title":"Das Busticket","bet":["ZEYNEP","HERR BRANDT"],"task":"Was verrät das Ticket?","tip1":"140","tip2":"275","classic":false,"body":[{"t":"p","text":"Um 10:20 Uhr verschwindet am Rathaus eine Spendendose. Zeynep sagt: „Ich bin schon um zehn am Rathaus in die Linie 3 gestiegen und bis zur Endhaltestelle gefahren. Hier, mein Ticket!\" Auf dem Ticket ist ein Stempel vom Entwerter im Bus: „Linie 3 · Rathaus · 10:42\"."},{"t":"ill","kind":"ill","text":"Das Busticket mit dem Stempel „Linie 3 · Rathaus · 10:42\"."}]},{"n":"16","cat":"Rechnen","tags":[],"stars":1,"min":3,"double":false,"hint":false,"title":"Die neue Kerze","bet":["LUIGI","HERR BRANDT"],"task":"Seit wann brennt die Kerze wirklich?","tip1":"146","tip2":"250","classic":false,"body":[{"t":"p","text":"Um 19 Uhr verschwindet im Treppenhaus ein Paket. Um 21 Uhr klingelt Herr Brandt bei Luigi. „Montags ist die Pizzeria zu. Ich sitz seit sechs Uhr hier und lese\", sagt Luigi. „Da hab ich mir eine neue Kerze angezündet.\" Auf dem Tisch brennt eine Kerze, daneben liegt ein aufgeschlagenes Buch. Auf der Packung daneben steht: „Länge 20 cm. Brennt 2 cm pro Stunde.\" Herr Brandt misst nach: Die Kerze ist noch 18 cm lang."}]},{"n":"17","cat":"Beweisstück","tags":["HINWEISBILD"],"stars":1,"min":2,"double":false,"hint":true,"title":"Das Selfie mit der Turmuhr","bet":["MIA","HERR BRANDT"],"task":"Warum hilft Mia ihr Selfie nicht?","tip1":"384","tip2":"335","classic":false,"body":[{"t":"p","text":"Um Punkt 12 Uhr verschwindet am Wochenmarkt ein Korb voller Honiggläser. Mia sagt: „Um zwölf saß ich im Café am Rathausplatz. Schau, mein Selfie!\" Auf dem Foto lacht Mia mit einem Cappuccino. Hinter ihr sieht man das Rathaus. Die Rathausuhr wird per Funk gestellt und geht auf die Minute genau."},{"t":"ill","kind":"hint","text":"Mias Selfie mit Cappuccino, im Hintergrund das Rathaus. Die Uhr zeigt deutlich Viertel nach vier."}]},{"n":"18","cat":"Rechnen","tags":[],"stars":1,"min":2,"double":false,"hint":false,"title":"Das Wechselgeld","bet":["CAN","BEN","KEMAL"],"task":"Wie viel Wechselgeld bekommt Ben, und wer hat recht?","tip1":"173","tip2":"259","classic":false,"body":[{"t":"p","text":"Ben bestellt bei Can einen Döner für 7,50 € und einen Ayran für 1,80 €. Er zahlt mit einem 20-Euro-Schein. Can gibt ihm 9,70 € zurück. Ben protestiert. Can sagt: „Stimmt doch genau!\" Kemal ruft vom Grill: „Rechnet doch mal nach!\""}]},{"n":"19","cat":"Geheimcode","tags":[],"stars":1,"min":2,"double":false,"hint":false,"title":"Brandts Einkaufszettel","bet":["ANNA","HERR BRANDT"],"task":"Wo treffen sich die beiden?","tip1":"113","tip2":"289","classic":false,"body":[{"t":"p","text":"Herr Brandt drückt Anna einen Einkaufszettel in die Hand und flüstert: „Da steht drauf, wo wir uns nachher treffen. Aber nicht weitersagen.\""},{"t":"paper","kind":"einkauf","lines":["Kartoffeln","Ingwer","Oliven","Salz","Kürbis"]}]},{"n":"20","cat":"Rechnen","tags":[],"stars":1,"min":2,"double":false,"hint":false,"title":"Ein Brötchen zu wenig","bet":["MEHMET","BEN"],"task":"Wie viele Brötchen fehlen?","tip1":"287","tip2":"337","classic":false,"body":[{"t":"p","text":"Bäcker Mehmet packt 12 Brötchen in eine Papiertüte. Jedes wiegt 60 Gramm, die leere Tüte 10 Gramm. Ben trägt die Tüte allein zum Sportverein. Dort stellt sie der Trainer auf die Waage: 670 Gramm. „Ich hab nichts angerührt!\", sagt Ben mit vollen Backen."}]},{"n":"21","cat":"Querdenken","tags":[],"stars":1,"min":3,"double":false,"hint":false,"title":"Drei volle Milchflaschen","bet":["IGOR","HERR BRANDT"],"task":"Warum glaubt Herr Brandt Igor nicht?","tip1":"317","tip2":"147","classic":false,"body":[{"t":"p","text":"Auf dem Land bringt der Milchbauer jeden Morgen um sechs eine Flasche Milch vor jede Haustür. Igor holt seine immer gleich beim Aufstehen rein. Am Mittwoch wird beim Nachbarn das Fahrrad gestohlen. Am Freitag um zehn sagt Igor: „Ich bin die ganze Woche zu Hause. Am Mittwoch hab ich vom Fenster aus einen Mann mit blauer Jacke gesehen.\" Vor Igors Tür stehen drei volle Milchflaschen."}]},{"n":"22","cat":"Logik","tags":[],"stars":1,"min":3,"double":false,"hint":false,"title":"Wer kam zuerst?","bet":["ANNA","BEN","CARLA","TOM","OMA HILDE"],"task":"Wer hat die Erdbeeren gegessen?","tip1":"305","tip2":"356","classic":false,"body":[{"t":"p","text":"Oma Hilde hat eine Schale Erdbeeren auf den Tisch gestellt. Ihre vier Gäste kommen nacheinander an. Als der zweite Gast kommt, ist die Schale schon leer. Wer als Erster da war, hat also alle Erdbeeren gegessen. Oma weiß nur noch:"},{"t":"list","kind":"num","items":["Carla kam direkt nach Ben.","Tom kam irgendwann nach Anna.","Tom kam nicht als Letzter."]}]},{"n":"23","cat":"Beweisstück","tags":[],"stars":2,"min":4,"double":false,"hint":false,"title":"Der Samstagsbus","bet":["EMRE","LUIGI","ZEYNEP"],"task":"Wessen Alibi platzt?","tip1":"323","tip2":"130","classic":false,"body":[{"t":"p","text":"Samstag, 17:45 Uhr. Am Kiosk neben dem Marktplatz greift jemand in die offene Kasse und verschwindet. Luigis Pizzeria liegt direkt daneben."},{"t":"stmts","rows":[["Emre","„Ich hab um 17:40 Uhr am Marktplatz den Bus Linie 7 genommen. Um 17:55 Uhr war ich am Bahnhof.\""],["Luigi","„Ich stand ab 17 Uhr in meiner Pizzeria. Fragen Sie meine Gäste.\""],["Zeynep","„Samstags bin ich von 17 bis 18 Uhr mit meiner Tochter beim Kinderturnen.\""]]},{"t":"box","lines":["<b>FAHRPLAN AN DER HALTESTELLE · LINIE 7 · MARKTPLATZ → BAHNHOF · FAHRZEIT 15 MIN.</b>","Montag bis Freitag 17:10 · 17:25 · 17:40 · 17:55","Samstag 17:20 · 17:50","Sonntag und Feiertag 17:30"],"rows":[["line","<b>FAHRPLAN AN DER HALTESTELLE · LINIE 7 · MARKTPLATZ → BAHNHOF · FAHRZEIT 15 MIN.</b>",""],["line","Montag bis Freitag 17:10 · 17:25 · 17:40 · 17:55",""],["line","Samstag 17:20 · 17:50",""],["line","Sonntag und Feiertag 17:30",""]]}]},{"n":"24","cat":"Geheimcode","tags":[],"stars":2,"min":5,"double":false,"hint":false,"title":"Brandts Postkarte","bet":["ANNA","BEN","HERR BRANDT"],"task":"Was steht auf der Karte?","tip1":"209","tip2":"230","classic":false,"body":[{"t":"p","text":"Anna und Ben finden eine Postkarte ohne Absender:"},{"t":"p","text":"GHU VFKOXHVVHO OLHJW XQWHU GHP URWHQ EOXPHQWRSI"},{"t":"p","text":"Unterschrieben ist sie nur mit einem Buchstaben: E. Anna grinst: „Die ist von Herrn Brandt. Und die Unterschrift ist der Schlüssel.\" (Umlaute schreibt Herr Brandt mit zwei Buchstaben, Ü als UE.)"}]},{"n":"25","cat":"Rechnen","tags":[],"stars":2,"min":5,"double":false,"hint":false,"title":"Kassensturz bei Kemal","bet":["KEMAL"],"task":"Wie viele 2-Euro-Münzen lagen morgens im Fach, wie viele abends, und was hat der Dieb gemacht?","tip1":"306","tip2":"373","classic":false,"body":[{"t":"p","text":"Montag ist Ruhetag. Morgens zählt Kemal sein Münzfach: genau 20 Münzen, nur 1-Euro- und 2-Euro-Münzen, zusammen 31 Euro. Er schließt ab und geht. Abends zählt er noch einmal: wieder genau 20 Münzen, aber nur noch 27 Euro. Verkauft hat an diesem Tag niemand etwas."}]},{"n":"26","cat":"Logik","tags":[],"stars":2,"min":6,"double":false,"hint":false,"title":"Vier Bestellungen an Tisch 4","bet":["ALI","BEN","CARLA","EMRE","KEMAL"],"task":"Wer hat was bestellt, und wer ist ohne Bezahlen gegangen?","tip1":"322","tip2":"254","classic":false,"body":[{"t":"p","text":"An Tisch 4 sitzen Ali, Ben, Carla und Emre. Jeder bestellt ein anderes Essen (Döner, Lahmacun, Falafel, Pide) und ein anderes Getränk (Ayran, Cola, Wasser, Tee). Einer ist gegangen, ohne zu bezahlen. Emre ist als Erster aufgesprungen, er hatte es auffällig eilig. Kemal weiß nur: „Es war der mit dem Wasser.\" Die Aushilfe erinnert sich:"},{"t":"list","kind":"num","items":["Wer Falafel isst, trinkt Wasser.","Ben isst weder Döner noch Falafel.","Carla trinkt Ayran.","Zur Pide gab es Tee.","Emre isst keine Pide und trinkt kein Wasser.","Zum Lahmacun gab es Cola."]}]},{"n":"27","cat":"Verhör","tags":[],"stars":2,"min":5,"double":false,"hint":false,"title":"Wer hat den Roller genommen?","bet":["ALI","MIA","PETER","ZEYNEP"],"task":"Wer hat den Roller genommen?","tip1":"325","tip2":"226","classic":false,"body":[{"t":"p","text":"Vor der Schule ist ein E-Roller verschwunden. Herr Brandt hat vier Verdächtige. Einer war es. Genau zwei von ihnen sagen die Wahrheit, zwei lügen."},{"t":"stmts","rows":[["Ali","„Mia war's.\""],["Mia","„Ali war's.\""],["Peter","„Mia war's.\""],["Zeynep","„Peter war's nicht.\""]]}]},{"n":"28","cat":"Logik","tags":["Brandts Klassiker"],"stars":2,"min":4,"double":false,"hint":false,"title":"Die verflixten Gewürzdosen","bet":["KEMAL","HERR BRANDT"],"task":"Aus welcher Dose probiert Herr Brandt, und wie geht es weiter?","tip1":"202","tip2":"366","classic":true,"body":[{"t":"p","text":"In Kemals Küche stehen drei geschlossene Dosen. Auf der ersten steht „Chili\", auf der zweiten „Pfeffer\", auf der dritten „Chili & Pfeffer gemischt\". Kemal grinst: „Alle drei Schilder sind falsch. Du darfst aus genau einer Dose genau eine Prise nehmen und probieren. Dann sag mir, was in jeder Dose wirklich ist.\""}]},{"n":"29","cat":"Geheimcode","tags":[],"stars":2,"min":4,"double":false,"hint":false,"title":"Die alte SMS","bet":["BEN","OMA HILDE"],"task":"Wo will Oma Hilde Ben treffen?","tip1":"235","tip2":"167","classic":false,"body":[{"t":"p","text":"Oma Hilde hat noch ein Tastenhandy. Sie schickt Ben eine Nachricht, aber das Display ist kaputt. Ben sieht nur, welche Tasten sie gedrückt hat:"},{"t":"p","text":"22 · 777 · 88 · 33 · 222 · 55 · 33"},{"t":"p","text":"Auf jeder Taste stehen drei oder vier Buchstaben: 2 = ABC, 3 = DEF, 4 = GHI, 5 = JKL, 6 = MNO, 7 = PQRS, 8 = TUV, 9 = WXYZ. Einmal drücken gibt den ersten Buchstaben, zweimal den zweiten und so weiter."}]},{"n":"30","cat":"Rechnen","tags":[],"stars":2,"min":4,"double":false,"hint":false,"title":"Kinokasse","bet":["AYŞE","DEFNE","KASSIERER"],"task":"Wie alt ist Defne? Dürfen die beiden rein?","tip1":"359","tip2":"378","classic":false,"body":[{"t":"p","text":"Ayşe will mit ihrer Tochter Defne einen Film ab 16 Jahren sehen. Der Kassierer zweifelt: „Ist sie überhaupt schon 16?\" Ayşe lacht: „Ich bin dreimal so alt wie sie. Und in sechzehn Jahren bin ich nur noch doppelt so alt.\""}]},{"n":"31","cat":"Zeitleiste","tags":[],"stars":2,"min":4,"double":false,"hint":false,"title":"Anruf nach New York","bet":["DRAGAN","HERR BRANDT"],"task":"Was stimmt an Dragans Geschichte nicht?","tip1":"245","tip2":"338","classic":false,"body":[{"t":"p","text":"Ende November, ein Dienstag. Um 9 Uhr morgens wird in München Hans' Werkzeugkiste aus dem Keller geklaut. Dragan sagt: „Um neun hab ich mit meinem Cousin in New York telefoniert, eine Stunde lang. Er saß gerade beim Mittagessen in seiner Firma, das hat man gehört.\" Herr Brandt weiß: New York liegt im November sechs Stunden hinter München."}]},{"n":"32","cat":"Tatortbild","tags":["HINWEISBILD"],"stars":2,"min":5,"double":false,"hint":true,"title":"Die Uhr im Spiegel","bet":["CAN","HERR BRANDT"],"task":"Warum ist das Foto für Can kein Alibi?","tip1":"388","tip2":"232","classic":false,"body":[{"t":"p","text":"Um 9:40 Uhr wird im Fitnessstudio ein Spind aufgebrochen. Can zeigt ein Foto: „Um 9:40 Uhr stand ich zu Hause vorm Badezimmerspiegel. Schau, die Uhr hinter mir zeigt genau 9:40!\" Auf dem Foto sieht man Can im Spiegel. Hinter ihm hängt eine Uhr ohne Ziffern, nur mit Strichen."},{"t":"ill","kind":"hint","text":"Spiegelselfie. Hinter Can im Spiegel die Uhr ohne Ziffern: kleiner Zeiger kurz vor der 10, großer Zeiger auf der 8, so wie man es im Spiegel sieht."}]},{"n":"33","cat":"Logik","tags":[],"stars":2,"min":6,"double":false,"hint":false,"title":"Das Zahlenschloss im Vereinsheim","bet":["HANS","ANNA"],"task":"Wie lautet die Zahl?","tip1":"233","tip2":"307","classic":false,"body":[{"t":"p","text":"Das Zahlenschloss am Getränkeschrank hat drei verschiedene Ziffern. Hans hat die Zahl vergessen, aber Anna findet seinen Spickzettel:"},{"t":"stmts","rows":[["147","Eine Ziffer stimmt und steht an der richtigen Stelle."],["189","Eine Ziffer stimmt, steht aber an der falschen Stelle."],["964","Zwei Ziffern stimmen, stehen aber beide an der falschen Stelle."],["286","Eine Ziffer stimmt, steht aber an der falschen Stelle."]]}]},{"n":"34","cat":"Rechnen","tags":["Brandts Klassiker"],"stars":2,"min":4,"double":false,"hint":false,"title":"Kemals Spieße","bet":["KEMAL","LUIGI"],"task":"Hat Luigi recht? Wie geht das?","tip1":"107","tip2":"367","classic":true,"body":[{"t":"p","text":"Kemal will drei Spieße grillen. Auf seinen kleinen Grill passen nur zwei auf einmal. Jeder Spieß braucht auf jeder Seite 5 Minuten. Kemal: „Unter 20 Minuten geht das nicht.\" Luigi: „Wetten, dass ich es in 15 schaffe?\""}]},{"n":"35","cat":"Logik","tags":[],"stars":2,"min":5,"double":false,"hint":false,"title":"Der Wasserfleck","bet":["GRETA","PETER","IGOR","MIA","HANS"],"task":"Wer hat den Wasserschaden verursacht?","tip1":"158","tip2":"297","classic":false,"body":[{"t":"p","text":"In einem Haus mit fünf Stockwerken wohnt in jedem Stock genau eine Person. Bei Mia tropft Wasser von der Decke. Schuld ist also, wer direkt über ihr wohnt. Hans, der Hausmeister, weiß:"},{"t":"list","kind":"num","items":["Hans selbst wohnt im 1. Stock.","Greta wohnt zwei Stockwerke über Mia.","Peter wohnt direkt über oder direkt unter Mia.","Peter wohnt weiter oben als Igor."]}]},{"n":"36","cat":"Querdenken","tags":["Brandts Klassiker"],"stars":2,"min":4,"double":false,"hint":false,"title":"Der Silvester-Geburtstag","bet":["TOM","ANNA"],"task":"Kann Tom die Wahrheit sagen? Wann hat er Geburtstag?","tip1":"134","tip2":"310","classic":true,"body":[{"t":"p","text":"Am Neujahrstag sagt Tom: „Vorgestern war ich noch 9. Und nächstes Jahr werde ich 12.\" Anna: „Du lügst. Das geht doch gar nicht!\""}]},{"n":"37","cat":"Logik","tags":[],"stars":2,"min":6,"double":false,"hint":false,"title":"Wem gehört der Hund?","bet":["ZEYNEP","CAN","LUIGI","AYŞE"],"task":"Wem gehört der Hund?","tip1":"372","tip2":"281","classic":false,"body":[{"t":"p","text":"In einem anderen Haus mit vier Stockwerken wohnt in jedem Stock eine Person mit einem anderen Haustier: Hund, Katze, Papagei, Hamster. Im Treppenhaus ist Hans' neue Fußmatte zerkaut. Das kann nur der Hund gewesen sein."},{"t":"list","kind":"num","items":["Zeynep hat eine Katze.","Zeynep wohnt im 4. Stock.","Der Papagei wohnt im 1. Stock.","Luigi wohnt direkt über Can.","Ayşe wohnt nicht im 1. Stock.","Der Hamster wohnt direkt unter der Katze."]}]},{"n":"38","cat":"Zeitleiste","tags":[],"stars":2,"min":4,"double":false,"hint":false,"title":"Bis zum Abspann","bet":["MIA","HERR BRANDT"],"task":"Kann Mias Geschichte stimmen?","tip1":"234","tip2":"272","classic":false,"body":[{"t":"p","text":"Um 22:10 Uhr wird vor Mias Haus ein Fahrrad geklaut. Mia sagt: „Ich war im Kino, in der Vorstellung um 20:15 Uhr. Ich hab den ganzen Film gesehen, bis zum Schluss. Um 22:10 Uhr war ich schon zu Hause, das Kino ist nur 5 Minuten weg.\" Auf dem Kinoplakat steht: „Vorstellung 20:15 Uhr · zuerst 20 Minuten Werbung, dann der Film · Filmlänge 1 Std. 50 Min.\""}]},{"n":"39","cat":"Querdenken","tags":[],"stars":2,"min":3,"double":false,"hint":false,"title":"Sonnenuntergang auf der Zugspitze","bet":["LARS","HERR BRANDT"],"task":"Was stimmt an Lars' Geschichte nicht?","tip1":"127","tip2":"284","classic":false,"body":[{"t":"p","text":"An einem Sonntag Mitte Dezember wird am Abend in Lars' Nachbarschaft eingebrochen. Lars sagt: „Ich war den ganzen Sonntag auf der Zugspitze. Um sieben Uhr abends hab ich noch den Sonnenuntergang fotografiert, wunderschön! Danach bin ich erst runter.\""}]},{"n":"40","cat":"Logik","tags":[],"stars":2,"min":4,"double":false,"hint":false,"title":"Die angebrannte Torte","bet":["AYŞE","LUIGI","MEHMET","OMA HILDE"],"task":"Wer hat die angebrannte Torte mitgebracht? Und wer kam womit und brachte was?","tip1":"260","tip2":"210","classic":false,"body":[{"t":"p","text":"Zu Oma Hildes Fest bringt jeder der drei Gäste etwas mit: eine Torte, einen Salat oder ein Brot. Jeder kommt anders: mit dem Fahrrad, dem Bus oder dem Auto. Die Torte ist leider angebrannt. Wer hat sie mitgebracht?"},{"t":"list","kind":"num","items":["Mehmet bringt ausnahmsweise kein Brot mit.","Der Salat kam mit dem Fahrrad.","Ayşe kam mit dem Auto.","Die Torte kam nicht mit dem Bus."]}]},{"n":"41","cat":"Verhör","tags":[],"stars":2,"min":5,"double":false,"hint":false,"title":"Das letzte Stück Käsesahne","bet":["AYŞE","DEFNE","EMRE","MEHMET","OMA HILDE"],"task":"Wer hat das Stück gegessen, und wer schwindelt?","tip1":"221","tip2":"137","classic":false,"body":[{"t":"p","text":"Vereinsfest im Gemeindesaal. Auf dem Kuchenbuffet stand noch genau ein Stück von Oma Hildes berühmter Käsesahne. Oma hatte es für Herrn Brandt zurückgelegt. Jetzt ist der Teller leer, nur ein paar Krümel liegen daneben. In der Nähe des Buffets standen vier Gäste. Herr Brandt fragt jeden einzeln:"},{"t":"stmts","rows":[["Ayşe","„Mehmet war's nicht.\""],["Emre","„Mehmet sagt die Wahrheit.\""],["Defne","„Mama war's nicht.\""],["Mehmet","„Ich war's nicht.\""]]},{"t":"p","text":"Oma Hilde hat das Buffet aus der Küche beobachtet. Wer es war, hat sie nicht gesehen. Aber sie ist sich sicher: Genau einer von den vieren schwindelt."}]},{"n":"42","cat":"Rechnen","tags":["Brandts Klassiker"],"stars":2,"min":4,"double":false,"hint":false,"title":"Der Weg zum Bäcker","bet":["BEN","ANNA"],"task":"Hat Ben recht?","tip1":"224","tip2":"159","classic":true,"body":[{"t":"p","text":"Ben läuft jeden Morgen zum Bäcker. Hin geht er mit 6 km/h, zurück mit vollen Tüten nur mit 3 km/h. Hin- und Rückweg sind gleich lang. Anna fragt: „Wie schnell bist du im Durchschnitt?\" Ben: „Na, 4,5 km/h!\""}]},{"n":"43","cat":"Querdenken","tags":["Brandts Klassiker"],"stars":2,"min":4,"double":false,"hint":false,"title":"Drei Schalter, eine Lampe","bet":["HERR BRANDT"],"task":"Wie findet er den richtigen Schalter?","tip1":"132","tip2":"379","classic":true,"body":[{"t":"p","text":"Im Keller von Herrn Brandts Altbau gibt es drei Schalter. Nur einer gehört zur Glühbirne auf dem Dachboden, vier Stockwerke höher. Vom Keller aus sieht man nichts. Herr Brandt darf die Schalter umlegen, so oft er will, aber nur ein einziges Mal nach oben gehen."}]},{"n":"44","cat":"Rechnen","tags":["Brandts Klassiker"],"stars":2,"min":4,"double":false,"hint":false,"title":"Die Torte in acht Stücken","bet":["OMA HILDE","ANNA"],"task":"Wie geht das?","tip1":"280","tip2":"217","classic":true,"body":[{"t":"p","text":"Oma Hilde will eine runde Torte mit nur drei geraden Schnitten in acht gleich große Stücke teilen. Die Stücke dürfen beim Schneiden nicht verschoben werden."}]},{"n":"45","cat":"Beweisstück","tags":[],"stars":2,"min":4,"double":false,"hint":false,"title":"Die Kurtaxe","bet":["MEHMET","HERR BRANDT"],"task":"Kann Mehmets Geschichte stimmen?","tip1":"273","tip2":"319","classic":false,"body":[{"t":"p","text":"Am Samstagabend verschwindet aus dem Vereinsheim die Kasse des Kegelclubs. Mehmet ist sofort zur Stelle: „Ich war von Freitag bis Sonntag mit meiner Frau in Garmisch. Hier, die Hotelrechnung!\""},{"t":"box","lines":["<b>BEWEISSTÜCK</b>","Hotel Alpenblick · Garmisch-Partenkirchen","Gast: Mehmet K. · 2 Personen · Anreise: Freitag","Doppelzimmer mit Frühstück ........ 118,00 €","Kurbeitrag ........................... 7,00 €","Summe ............................. 125,00 €","Kleingedruckt: „Der Kurbeitrag beträgt 3,50 € pro Person und Nacht.\""],"rows":[["line","<b>BEWEISSTÜCK</b>",""],["line","Hotel Alpenblick · Garmisch-Partenkirchen",""],["line","Gast: Mehmet K. · 2 Personen · Anreise: Freitag",""],["lead","Doppelzimmer mit Frühstück","118,00 €"],["lead","Kurbeitrag","7,00 €"],["lead","Summe","125,00 €"],["line","Kleingedruckt: „Der Kurbeitrag beträgt 3,50 € pro Person und Nacht.\"",""]]}]},{"n":"46","cat":"Tatortbild","tags":["HINWEISBILD"],"stars":2,"min":4,"double":false,"hint":true,"title":"Das Abreißkalenderblatt","bet":["GRETA","JONAS","HERR BRANDT"],"task":"Was verrät der Kalender?","tip1":"374","tip2":"240","classic":false,"body":[{"t":"p","text":"Oma Greta war von Freitag bis Dienstag im Kurzurlaub. Ihren Wohnungsschlüssel hat nur ihr Enkel Jonas. Als sie am Dienstag zurückkommt, fehlen 50 Euro aus der Keksdose. Jonas: „Ich war die ganze Zeit nicht in deiner Wohnung.\" An Gretas Küchenwand hängt ein Abreißkalender. Greta reißt jeden Morgen das alte Blatt ab. Am Freitagmorgen hat sie das Blatt vom Donnerstag abgerissen und ist abgefahren. Herr Brandt sieht sich in der Küche um."},{"t":"ill","kind":"hint","text":"Gretas Küche. Die Keksdose steht offen, an der Wand der Abreißkalender, oberstes Blatt: Montag."}]},{"n":"47","cat":"Zeitleiste","tags":[],"stars":2,"min":4,"double":false,"hint":false,"title":"Das Scanner-Protokoll","bet":["LARS","GRETA","HERR BRANDT"],"task":"Was stimmt nicht?","tip1":"165","tip2":"244","classic":false,"body":[{"t":"p","text":"Greta wartet auf ein Paket. Laut Sendungsverfolgung wurde es um 10:05 Uhr „vor die Haustür gelegt\", aber da ist nichts. Paketbote Lars schwört: „Ich hab's um 10:05 Uhr selbst hingelegt.\" Herr Brandt lässt sich Lars' Scanner-Protokoll zeigen:"},{"t":"paper","kind":"scanner","lines":["10:00 Uhr · Bahnhofstraße 4 · zugestellt","10:03 Uhr · Bahnhofstraße 9 · zugestellt","10:05 Uhr · Rosenweg 2 (Greta) · vor die Haustür gelegt","10:07 Uhr · Bahnhofstraße 11 · zugestellt"]},{"t":"ill","kind":"ill","text":"Das Scannerprotokoll als Ausdruck."},{"t":"p","text":"Vom Bahnhof bis zum Rosenweg fährt man mit dem Lieferwagen 15 Minuten."}]},{"n":"48","cat":"Verhör","tags":[],"stars":3,"min":6,"double":false,"hint":false,"title":"Das Burgverlies","bet":["HERR BRANDT","ANNA","BEN","RITTER KUNO","RITTER BODO","RITTER GERO"],"task":"Durch welche Tür müssen die drei gehen?","tip1":"203","tip2":"324","classic":false,"body":[{"t":"p","text":"Im Burgmuseum gibt es ein Rätselzimmer. Herr Brandt, Anna und Ben sind darin „gefangen\" und müssen den Ausgang finden. Vor ihnen liegen drei Türen. Hinter genau einer liegt der Ausgang, hinter den anderen beiden warten hungrige Löwen aus Pappe, und wer sie weckt, hat verloren."},{"t":"p","text":"Vor den Türen stehen drei Schauspieler als Ritter. Jeder Ritter sagt entweder immer die Wahrheit oder lügt immer. Wer was ist, verrät das Museum nicht."},{"t":"stmts","rows":[["Kuno","„Bodo lügt.\""],["Bodo","„Gero und Kuno sind von derselben Sorte: Entweder lügen beide, oder beide sagen die Wahrheit.\""],["Gero","„Hinter Tür 1 warten die Löwen.\""]]}]},{"n":"49","cat":"Geheimcode","tags":[],"stars":3,"min":6,"double":false,"hint":false,"title":"Die Geheimschrift am Gartenzaun","bet":["ANNA","HERR BRANDT"],"task":"Wo versteckt der Dieb die Zwerge?","tip1":"179","tip2":"241","classic":false,"body":[{"t":"p","text":"In der Schrebergartenanlage verschwinden seit Wochen Gartenzwerge. Hinter dem Komposthaufen findet Anna einen Zettel, den der Dieb verloren hat:"},{"t":"p","text":"IBOSASMEMOTHUASE"},{"t":"p","text":"Unten auf dem Zettel ist ein kleiner Zaun gekritzelt: eine Latte oben, eine unten, eine oben, eine unten."},{"t":"ill","kind":"ill","text":"Der Zettel mit der Buchstabenreihe und dem gekritzelten Zickzackzaun."}]},{"n":"50","cat":"Beweisstück","tags":["HINWEISBILD"],"stars":3,"min":7,"double":false,"hint":true,"title":"Der Schatten auf dem Foto","bet":["EMRE","HERR BRANDT"],"task":"Wann ist das Foto wirklich entstanden, und hat Emre ein Alibi?","tip1":"266","tip2":"376","classic":false,"body":[{"t":"p","text":"Ein Samstag im Juli. Um 12 Uhr mittags verschwindet am Badesee die Kasse vom Kiosk. Emre zeigt Herrn Brandt ein Foto: „Das hab ich um Punkt zwölf am Aussichtspunkt im Wald gemacht, 30 Kilometer von hier. Die Uhrzeit hab ich in der Kamera ausgeschaltet, aber glauben Sie mir.\""},{"t":"p","text":"Am Aussichtspunkt ist eine große Windrose aus Stein in den Boden eingelassen: Norden, Osten, Süden, Westen. Emre steht genau in der Mitte. Mit dem Auto braucht man vom Aussichtspunkt zum Badesee eine halbe Stunde."},{"t":"ill","kind":"hint","text":"Emre in der Mitte der Windrose. Sein Schatten ist lang, fast doppelt so lang wie er selbst, und fällt genau auf das W für Westen."}]},{"n":"51","cat":"Logik","tags":["Doppelseite"],"stars":3,"min":8,"double":true,"hint":false,"title":"Popcorn im Kino","bet":["ANNA","BEN","CARLA","LEA","MAX","TOM"],"task":"Wer hat Carlas Popcorn gegessen?","tip1":"375","tip2":"360","classic":false,"body":[{"t":"p","text":"Sechs Freunde sitzen im Kino nebeneinander auf den Plätzen 1 bis 6. Platz 1 ist ganz links, wenn man auf die Leinwand schaut."},{"t":"p","text":"Carla hat ihren Popcorneimer die ganze Zeit rechts neben sich auf der Armlehne. Als das Licht angeht, ist er leer, und Carla hat kaum etwas gegessen. Nur wer direkt rechts neben Carla saß, kam an den Eimer heran."},{"t":"p","text":"Herr Brandt kommt erst nach dem Film dazu. Keiner weiß mehr genau, wer wo saß. Diese Hinweise bekommt er zusammen:"},{"t":"list","kind":"num","items":["Anna saß auf einem der beiden Plätze ganz außen.","Tom saß direkt neben Anna.","Zwischen Anna und Max saßen genau zwei Personen.","Tom saß irgendwo links von Carla.","Ben saß direkt rechts neben Lea."]},{"t":"ill","kind":"ill","text":"Sechs Kinosessel von hinten, nummeriert, mit leeren Namensfeldern zum Eintragen."}]},{"n":"52","cat":"Rechnen","tags":["Brandts Klassiker"],"stars":3,"min":6,"double":false,"hint":false,"title":"Kemals Ayrankannen","bet":["KEMAL","CAN"],"task":"Wie kommt Kemal auf genau 4 Liter?","tip1":"357","tip2":"211","classic":true,"body":[{"t":"p","text":"Für sein Spezialrezept braucht Kemal genau 4 Liter Ayran. Er hat einen großen Kanister voll Ayran, aber nur zwei Kannen ohne Striche: Die eine fasst genau 5 Liter, die andere genau 3 Liter. Can lacht: „Ohne Messbecher? Unmöglich!\""}]},{"n":"53","cat":"Querdenken","tags":[],"stars":3,"min":6,"double":false,"hint":false,"title":"Blitz und Donner","bet":["HANS","IGOR","HERR BRANDT"],"task":"Warum glaubt Herr Brandt Hans nicht?","tip1":"152","tip2":"176","classic":false,"body":[{"t":"p","text":"Freitagabend, Stadtfest, ein heftiges Gewitter. Um genau 21:03 Uhr schlägt ein Blitz in den Kirchturm. Auf dem ganzen Kirchplatz geht das Licht aus, und in der Dunkelheit verschwindet die Kasse der Losbude direkt neben der Kirche."},{"t":"p","text":"Hans sagt: „Um 21:03 Uhr war ich zu Hause, drei Kilometer von der Kirche weg. Ich stand am Fenster und hab gesehen, wie der Blitz in den Kirchturm geschlagen ist. Im selben Moment hat es fürchterlich gekracht.\""},{"t":"p","text":"Igor, der Taxifahrer, stand um diese Zeit am Bahnhof, ebenfalls genau drei Kilometer von der Kirche entfernt. „Ich hab den Blitz in den Turm einschlagen sehen und gezählt, wie ich es als Kind gelernt habe: Neun Sekunden, dann kam der Donner.\""}]},{"n":"54","cat":"Verhör","tags":[],"stars":3,"min":8,"double":false,"hint":false,"title":"Ein wahrer und ein falscher Satz","bet":["CAN","MIA","IGOR","ZEYNEP","HERR BRANDT"],"task":"Wer hat die Krone versteckt, und wo ist sie?","tip1":"169","tip2":"103","classic":false,"body":[{"t":"p","text":"Einen Tag vor der Premiere des Schultheaters ist die goldene Krone des Königs verschwunden. Vier Helfer hatten einen Schlüssel: Can, Mia, Igor und Zeynep. Einer von ihnen hat die Krone versteckt, im Keller, auf dem Dachboden oder im Schulgarten."},{"t":"p","text":"Can grinst: „Wir machen es Ihnen nicht zu leicht, Herr Brandt. Jeder von uns sagt einen wahren und einen falschen Satz. Welcher welcher ist, müssen Sie selbst herausfinden.\""},{"t":"stmts","rows":[["Can","„Mia war's nicht. Ich war's nicht.\""],["Mia","„Ich war's nicht. Igor war's.\""],["Igor","„Ich war's nicht. Die Krone ist im Keller.\""],["Zeynep","„Die Krone ist nicht im Garten. Ich war's.\""]]}]},{"n":"55","cat":"Zeitleiste","tags":["Doppelseite"],"stars":3,"min":10,"double":true,"hint":false,"title":"Der Weg durch die Stadt","bet":["ZEYNEP","LUIGI","KEMAL","ANNA"],"task":"Wer kann um 10:00 Uhr am Kiosk gewesen sein?","tip1":"109","tip2":"139","classic":false,"body":[{"t":"p","text":"Samstagvormittag. Die Kamera am Kiosk zeigt: Um genau 10:00 Uhr greift jemand mit Kapuze in die Kasse und rennt sofort davon. Vier Personen waren an diesem Morgen in der Nähe. Alle sind zu Fuß unterwegs, und niemand ist schneller als die Gehzeiten auf dem Plan."},{"t":"table","head":["Weg","Gehzeit"],"rows":[["Kiosk und Markt","10 Min."],["Kiosk und Bäckerei","4 Min."],["Kiosk und Bahnhof","12 Min."],["Markt und Bäckerei","8 Min."],["Bäckerei und Bahnhof","9 Min."],["Markt und Bahnhof","15 Min."]]},{"t":"p","text":"Sicher belegt ist:"},{"t":"table","head":["Person","Erster Nachweis","Zweiter Nachweis"],"rows":[["Zeynep","bis 9:52 Uhr am Markt (Kundin bestätigt)","ab 10:08 Uhr wieder am Markt"],["Luigi","9:55 Uhr Kassenbon der Bäckerei","10:12 Uhr Fahrkarte am Bahnhof"],["Kemal","9:50 Uhr am Bahnhof gesehen","10:05 Uhr in der Bäckerei"],["Anna","9:49 Uhr am Markt","10:03 Uhr in der Bäckerei"]]},{"t":"ill","kind":"ill","text":"Illustrierter Stadtplan mit den vier Orten und Wegen samt Minuten. Daneben eine Zeitleiste von 9:45 bis 10:15 Uhr zum Eintragen."}]},{"n":"56","cat":"Geheimcode","tags":[],"stars":3,"min":7,"double":false,"hint":false,"title":"Das Zahlengitter","bet":["ANNA","BEN","HERR BRANDT"],"task":"Wo und wann wollen sich Anna und Ben treffen?","tip1":"268","tip2":"253","classic":false,"body":[{"t":"p","text":"Im Unterricht schiebt Anna Ben einen Zettel zu. Die Lehrerin soll ihn auf keinen Fall lesen können:"},{"t":"p","text":"13 35 · 11 12 45 14 14 23 14 · 45 35 · 51 32 23 12"},{"t":"p","text":"Auf der Rückseite hat Anna ein leeres Gitter mit 5 mal 5 Kästchen gezeichnet, die Reihen und Spalten von 1 bis 5 nummeriert. Darunter steht: „Schlüssel: BRANDT. Kein J, das I muss reichen.\""},{"t":"ill","kind":"ill","text":"Der Zettel und das leere 5 mal 5 Gitter mit den Zahlen 1 bis 5 am Rand."}]},{"n":"57","cat":"Tatortbild","tags":["HINWEISBILD"],"stars":3,"min":6,"double":false,"hint":true,"title":"Der verstellte Fahrersitz","bet":["MIA","PETER","LARS","OMA GRETA","HERR BRANDT"],"task":"Wer saß wirklich am Steuer?","tip1":"218","tip2":"347","classic":false,"body":[{"t":"p","text":"Kurz vor Mitternacht fährt ein kleines blaues Auto beim Ausparken Oma Gretas Gartenzaun um und fährt einfach weiter. Am nächsten Morgen steht das Auto vor Mias Haus, vorne eingedellt. Mia sagt sofort: „Ich bin gefahren. Es tut mir leid.\""},{"t":"p","text":"Am Abend waren außer Mia nur zwei Leute mit dem Auto unterwegs: ihr großer Bruder Peter und ihr Kollege Lars. Herr Brandt notiert: Mia ist 1,58 Meter groß und trägt Schuhgröße 37. Peter ist 1,92 Meter groß, Schuhgröße 46. Lars ist 1,74 Meter groß, Schuhgröße 41. Dann öffnet er die Fahrertür."},{"t":"ill","kind":"hint","text":"Blick in das Auto. Der Fahrersitz ist ganz nach hinten geschoben, die Kopfstütze ganz nach oben gezogen. Auf der Fahrerfußmatte ein großer, schlammiger Schuhabdruck. Herr Brandt hat Mias Schuh daneben gelegt: Der Abdruck ist viel länger. Auf dem Rücksitz liegt Mias Sitzkissen."}]},{"n":"58","cat":"Rechnen","tags":["Brandts Klassiker","Doppelseite"],"stars":3,"min":12,"double":true,"hint":false,"title":"Die zwölf Kugeln","bet":["KEMAL","CAN","HERR BRANDT"],"task":"Wie findet man mit drei Wägungen die falsche Kugel und weiß danach auch, ob sie schwerer oder leichter ist?","tip1":"346","tip2":"193","classic":true,"body":[{"t":"p","text":"Kemal hat zwölf Metallkugeln, die alle genau gleich aussehen. Eine davon ist falsch: ein kleines bisschen schwerer oder leichter als die anderen. Ob schwerer oder leichter, weiß niemand. Kemal hat eine Balkenwaage ohne Gewichte."},{"t":"p","text":"Can: „Das schafft keiner mit nur drei Wägungen.\" Herr Brandt: „Doch. Und am Ende weiß man sogar, ob die Kugel schwerer oder leichter ist.\""}]},{"n":"59","cat":"Logik","tags":["Doppelseite"],"stars":3,"min":10,"double":true,"hint":false,"title":"Der Flohmarkt","bet":["OMA HILDE","HERR SOMMER","OMA GRETA","ZEYNEP","DRAGAN","HERR BRANDT"],"task":"Wer verkauft Oma Hildes Kuckucksuhr?","tip1":"295","tip2":"342","classic":false,"body":[{"t":"p","text":"Oma Hildes alte Kuckucksuhr ist aus ihrem Gartenhäuschen verschwunden. Am Sonntag auf dem Flohmarkt glaubt sie, ihren Kuckuck rufen zu hören. Vier Stände stehen nebeneinander, Stand 1 ganz links bis Stand 4 ganz rechts. An jedem Stand verkauft eine andere Person: Herr Sommer, Oma Greta, Zeynep und Dragan. Jeder bietet ein Stück an, die Kuckucksuhr, eine Lampe, einen Teddy oder Schallplatten, und jeder verlangt einen anderen Preis: 5, 10, 15 oder 20 Euro."},{"t":"p","text":"Dragan, der jeden Händler auf dem Markt kennt, hilft Herrn Brandt mit diesen Hinweisen:"},{"t":"list","kind":"num","items":["Die Kuckucksuhr ist das teuerste Stück.","Ich selbst stehe ganz rechts.","Der Teddy kostet 5 Euro und liegt direkt links neben der Uhr.","Zeynep verkauft keine Lampe und steht nicht am Rand.","Am Stand 3 kostet alles 10 Euro.","Zeynep ist billiger als Herr Sommer."]},{"t":"ill","kind":"ill","text":"Vier Flohmarktstände von vorne, mit leeren Schildern für Name, Ware und Preis. Daneben ein Logikgitter zum Ausfüllen."}]},{"n":"60","cat":"Zeitleiste","tags":[],"stars":3,"min":9,"double":false,"hint":false,"title":"Die falschen Uhren","bet":["LUIGI","KEMAL","MEHMET","MIA","ZEYNEP","IGOR","DRAGAN"],"task":"Wer hat die Glocke abgeschraubt?","tip1":"278","tip2":"225","classic":false,"body":[{"t":"p","text":"Luigis Ladenglocke ist weg. Jemand hat sie von der Tür abgeschraubt. Luigi ist empört: „Laut meiner Küchenuhr um 18:20 Uhr! Ich hab genau hingeschaut.\""},{"t":"p","text":"Drei Leute kommen infrage:"},{"t":"stmts","rows":[["Kemal","Zeynep hat ihn auf dem Markt gesehen. Ihre Armbanduhr zeigte da 18:15 Uhr."],["Mehmet","Er hat in seiner Bäckerei einen Kassenbon gedruckt. Darauf steht 18:12 Uhr."],["Mia","Sie saß in Igors Taxi. Laut Taxameter fuhr sie von 18:05 bis 18:20 Uhr vom Bahnhof bis an den Stadtrand."]]},{"t":"p","text":"Wege zu Fuß: von Luigis Pizzeria zum Markt 10 Minuten, zur Bäckerei 5 Minuten."},{"t":"p","text":"Dragan, der Uhrmacher, hatte letzte Woche alle Uhren in seiner Werkstatt: „Luigis Küchenuhr geht 10 Minuten vor. Zeyneps Armbanduhr geht 15 Minuten nach. Mehmets Kassenuhr geht 4 Minuten vor. Igors Taxameter geht auf die Sekunde genau.\""}]},{"n":"61","cat":"Beweisstück","tags":["HINWEISBILD"],"stars":3,"min":7,"double":false,"hint":true,"title":"Der Schrittzähler","bet":["LARS","BELLO (HUND)","HERR BRANDT"],"task":"Kann Lars' Geschichte stimmen?","tip1":"220","tip2":"231","classic":false,"body":[{"t":"p","text":"Um 20:20 Uhr verschwindet aus dem Schaufenster des Spielwarenladens am Marktplatz ein großes Modellschiff. Lars sagt: „Ich war von acht bis Viertel vor neun nur mit Bello draußen. Drei Runden um unseren Block, mehr nicht. Eine Runde ist 300 Meter.\""},{"t":"p","text":"Herr Brandt weiß: Von Lars' Haustür bis zum Marktplatz sind es genau 1,5 Kilometer. Lars trägt eine Sportuhr, die jeden Schritt zählt. Er zeigt sie bereitwillig her."},{"t":"ill","kind":"hint","text":"Die Anzeige der Sportuhr: „Heute 20:00 bis 20:45 Uhr: 4.000 Schritte\". In den Einstellungen darunter: „Schrittlänge: 75 cm\"."}]},{"n":"62","cat":"Querdenken","tags":["Brandts Klassiker"],"stars":3,"min":6,"double":false,"hint":false,"title":"Die drei Schließfächer","bet":["MEHMET","DER MODERATOR"],"task":"Sollte Mehmet wechseln, oder ist es egal?","tip1":"228","tip2":"212","classic":true,"body":[{"t":"p","text":"Bei einem Gewinnspiel stehen drei Schließfächer. In einem liegt ein Goldbarren, in den anderen beiden je ein alter Turnschuh. Mehmet wählt Fach 1."},{"t":"p","text":"Der Moderator weiß, wo das Gold liegt. Er öffnet immer eines der beiden anderen Fächer, in dem ein Turnschuh liegt, und bietet immer einen Wechsel an. Heute öffnet er Fach 3: ein Turnschuh. „Bleibst du bei Fach 1, oder wechselst du zu Fach 2?\""}]},{"n":"63","cat":"Tatortbild","tags":["HINWEISBILD"],"stars":3,"min":7,"double":false,"hint":true,"title":"Der verschmierte Zettel","bet":["AYŞE","MEHMET","MIA","HANS","HERR BRANDT"],"task":"Wer hat den Zettel geschrieben?","tip1":"243","tip2":"270","classic":false,"body":[{"t":"p","text":"Aus dem Vereinsheim ist die neue Musikanlage verschwunden. Auf dem Tisch liegt ein Zettel, mit Füller geschrieben: „Die Anlage ist in Sicherheit. Ihr bekommt sie zurück, wenn endlich jemand die Heizung repariert!\""},{"t":"p","text":"Einen Schlüssel haben nur vier Leute: Ayşe, Mehmet, Mia und Hausmeister Hans. Herr Brandt lässt alle vier das Protokoll unterschreiben und schaut genau zu."},{"t":"ill","kind":"hint","text":"Links der Zettel in Nahaufnahme: Die frische Tinte ist an vielen Stellen nach rechts verschmiert, quer über die Wörter. Rechts vier Hände beim Unterschreiben, mit Namensschildern. Ayşe schreibt mit links, Mehmet, Mia und Hans mit rechts."}]},{"n":"64","cat":"Verhör","tags":[],"stars":3,"min":9,"double":false,"hint":false,"title":"Die Tombola","bet":["ELIF","OMA GRETA","KEMAL","LUIGI","MEHMET","ANNA"],"task":"Wer hat das Los genommen, und wer schwindelt?","tip1":"291","tip2":"175","classic":false,"body":[{"t":"p","text":"Schulfest. Kurz vor der Ziehung ist das Los mit dem Hauptgewinn aus der Lostrommel verschwunden: ein Wellnesswochenende. Fünf Erwachsene haben beim Losverkauf geholfen. Herr Brandt fragt jeden:"},{"t":"stmts","rows":[["Elif","„Greta war's.\""],["Oma Greta","„Kemal war's.\""],["Kemal","„Greta lügt.\""],["Luigi","„Elif lügt.\""],["Mehmet","„Luigi lügt.\""]]},{"t":"p","text":"Anna hat die fünf die ganze Zeit beobachtet und flüstert Herrn Brandt zu: „Genau zwei von denen schwindeln.\""}]},{"n":"65","cat":"Logik","tags":[],"stars":3,"min":12,"double":false,"hint":false,"title":"Der Tresor","bet":["KEMAL","CAN"],"task":"Wie lautet der Code?","tip1":"182","tip2":"361","classic":false,"body":[{"t":"p","text":"Kemal ist im Urlaub. Can soll den Tresor im Laden öffnen, hat den Code aber vergessen. Der Code hat vier verschiedene Ziffern. Bei jedem falschen Versuch leuchten Lämpchen: Grün heißt richtige Ziffer an der richtigen Stelle. Gelb heißt richtige Ziffer an der falschen Stelle. Welche Ziffer gemeint ist, verraten die Lämpchen nicht."},{"t":"p","text":"Can hat gestern fünf Versuche aufgeschrieben:"},{"t":"table","head":["Versuch","Grün","Gelb"],"rows":[["8 3 1 6","2","0"],["3 2 1 0","2","0"],["6 5 0 3","0","1"],["7 9 0 3","0","0"],["1 7 4 0","0","1"]]}]},{"n":"66","cat":"Querdenken","tags":["Brandts Klassiker"],"stars":3,"min":10,"double":false,"hint":false,"title":"Die Brücke bei Nacht","bet":["ANNA","BEN","OMA HILDE","HERR BRANDT"],"task":"Wie kommen alle vier in 17 Minuten hinüber?","tip1":"126","tip2":"213","classic":true,"body":[{"t":"p","text":"Nachtwanderung. Die vier stehen vor einer alten Hängebrücke über eine Schlucht. Die Brücke trägt höchstens zwei Personen gleichzeitig, und ohne Taschenlampe ist es viel zu dunkel. Sie haben nur eine Taschenlampe, und die Batterie hält noch genau 17 Minuten. Wer zu zweit geht, muss sich nach dem Langsameren richten."},{"t":"p","text":"Anna braucht für die Brücke 1 Minute, Ben 2 Minuten, Oma Hilde 5 Minuten und Herr Brandt 10 Minuten."}]},{"n":"67","cat":"Meisterfall","tags":["Doppelseite"],"stars":3,"min":12,"double":true,"hint":false,"title":"Die Brosche von Oma Hilde","bet":["OMA HILDE","KEMAL","LUIGI","ZEYNEP","EMRE"],"task":"Wer hat die Brosche genommen?","tip1":"336","tip2":"282","classic":false,"body":[{"t":"p","text":"Oma Hilde feiert ihren 80. Geburtstag. Außer ihr sind nur vier Gäste da: Kemal, Luigi, Zeynep und Emre."},{"t":"p","text":"Um 15:00 Uhr legt Oma ihre goldene Brosche oben im Schlafzimmer auf die Kommode und kommt als Letzte die Treppe herunter. Danach ist oben niemand mehr. Oben gibt es nur das Schlafzimmer und ein Bad."},{"t":"p","text":"Die alte Holztreppe ist der einzige Weg nach oben, und sie knarrt bei jedem Schritt. Oma sitzt die ganze nächste Stunde im Sessel direkt neben der Treppe. Sie hört sie genau zweimal knarren: um 15:20 Uhr und um 15:40 Uhr."},{"t":"p","text":"Um 16:00 Uhr ist die Brosche weg. Oben ist niemand."},{"t":"stmts","rows":[["Kemal","„Ich stand die ganze Zeit mit Luigi am Grill im Garten.\""],["Luigi","„Fast die ganze Zeit. Kemal war mal kurz weg.\""],["Kemal","„Stimmt, ich hab Grillkohle aus dem Auto geholt. Das steht vor dem Haus.\""],["Zeynep","„Ich war um halb vier oben im Bad, aber wirklich nur zwei Minuten.\""],["Emre","„Ich hab den ganzen Nachmittag fotografiert. Hier, mein Handy.\""]]},{"t":"p","text":"Emres Fotos, mit Uhrzeit:"},{"t":"table","head":["Uhrzeit","Was man sieht"],"rows":[["15:10","Die Torte im Wohnzimmer"],["15:25","Luigi allein am Grill im Garten"],["15:35","Kemal kommt mit einem Sack Kohle durchs Gartentor"],["15:50","Alle stoßen im Garten an"]]},{"t":"ill","kind":"ill","text":"Doppelseite. Links ein Hausquerschnitt mit Treppe, Sessel und Zimmern. Rechts die vier Fotos als Sofortbilder mit Uhrzeit. Dazu eine Zeitleiste von 15:00 bis 16:00 Uhr zum Eintragen."}]},{"n":"68","cat":"Meisterfall","tags":["Doppelseite"],"stars":3,"min":15,"double":true,"hint":false,"title":"Brandts Notizbuch","bet":["HERR BRANDT","ALLE"],"task":"Wer hat Herrn Brandts Notizbuch genommen?","tip1":"216","tip2":"397","classic":false,"body":[{"t":"p","text":"Herr Brandt wird 70. Kemal hat seinen Laden für den Abend geschlossen, und alle sind gekommen: Oma Hilde, Oma Greta, Anna, Ben, Carla, Lea, Tom, Max, Luigi, Zeynep, Mehmet, Ayşe, Defne, Emre, Hans, Lars, Mia, Igor, Dragan und Can."},{"t":"p","text":"Um 20:00 Uhr hängt Herr Brandt seinen Mantel in die kleine Garderobe hinter der Küche. In der Innentasche steckt sein altes Notizbuch, in dem er seit Jahren jeden Fall aufschreibt. Um 20:30 Uhr will er daraus vorlesen. Die Innentasche ist leer."},{"t":"p","text":"Can hat an diesem Abend die Garderobe betreut. Für jeden, der hineinging, hat er die Uhrzeit von seinem Handy aufgeschrieben:"},{"t":"table","head":["Uhrzeit","Wer","Wozu"],"rows":[["20:02","Lars","holt sein Handy aus der Jacke"],["20:06","Zeynep","holt ihren Schal"],["20:09","Anna","hängt ihre Jacke auf"],["20:12","Luigi","holt sein Feuerzeug"],["20:15","Oma Hilde","holt ihre Lesebrille"],["20:21","Hans","holt seinen Autoschlüssel"],["20:30","Herr Brandt","Notizbuch weg"]]},{"t":"p","text":"Herr Brandt erinnert sich an noch etwas. Beim Unterschreiben im Gästebuch hat er genau hingeschaut, alte Gewohnheit: Lars, Ayşe und Oma Hilde schreiben mit links, alle anderen mit rechts. Hans trägt seinen linken Arm in Gips. Unterschrieben hat er trotzdem, mit rechts."},{"t":"p","text":"In der leeren Manteltasche steckt ein Zettel, mit Bleistift in Druckbuchstaben: „KEINE SORGE. DU BEKOMMST ES ZURÜCK. SCHÖNER ALS VORHER.\""},{"t":"ill","kind":"ill","text":"Erste Doppelseite: Kemals Laden voller Gäste, Girlanden, eine Torte mit 70 Kerzen. Zweite Doppelseite: die Garderobe mit Brandts Mantel, daneben Cans Liste als Zettel und das aufgeschlagene Gästebuch."}]}],"sol":{"10":{"n":"10","title":"Der nasse Regenschirm","paras":["Igor. Sein Schirm tropft. Den hat er also nach 14 Uhr draußen im Regen benutzt. Er war nicht „keine Minute draußen\"."],"trail":"Lars ist klatschnass und kam gerade von draußen. Das passt aber genau zu seiner Geschichte.","mark":"N","epilog":""},"11":{"n":"11","title":"Grüße aus Mallorca","paras":["Die Karte wurde in Deutschland abgeschickt. Aus Spanien bräuchte sie eine spanische Briefmarke und einen spanischen Stempel. „Briefzentrum 80\" ist München. Dragan war am Mittwoch also hier."],"trail":"Das Strandfoto beweist gar nichts. Postkarten mit Strand kann man überall kaufen.","mark":"D","epilog":""},"12":{"n":"12","title":"Pizza bei Luigi","paras":["4 Stücke. Für Ben und Tom bleiben 6. Tom hat x, Ben 2x, zusammen 3x = 6. Tom hatte 2, Ben 4. Mit 3 Stücken hätte Tom eineinhalb gehabt, und Luigi schneidet keine halben Stücke."],"trail":"3 klingt nach einem fairen Drittel von 8. Darum lügt Ben genau so.","mark":"T","epilog":""},"13":{"n":"13","title":"Der Hund, der nicht bellte","paras":["Frank. Bruno bellt bei allen außer der Familie. Er blieb still, also war es jemand aus der Familie. Frank gibt es zu: Er wollte die alte Kanne heimlich polieren lassen, als Geschenk zu Gretas Geburtstag. (Brandts Klassiker, frei nach Sherlock Holmes.)"],"trail":"Mia ist neu und unbekannt, Lars kommt oft vorbei. Bei beiden hätte Bruno gebellt.","mark":"S","epilog":""},"14":{"n":"14","title":"Scherben auf dem Rasen","paras":["Die Scheibe wurde von innen eingeschlagen. Scherben fliegen in die Richtung des Schlags. Wäre der Dieb von draußen gekommen, lägen sie drinnen. Jemand wollte nur einen Einbruch vortäuschen."],"trail":"Die Zacken im Rahmen zeigen nur, dass die Scheibe kaputt ist, nicht von welcher Seite.","mark":"N","epilog":""},"15":{"n":"15","title":"Das Busticket","paras":["Zeynep ist erst um 10:42 Uhr am Rathaus eingestiegen. Um 10:20 Uhr saß sie also nicht im Bus. Ihr Alibi für die Tatzeit platzt."],"trail":"Das Ticket ist echt, und darum fühlt Zeynep sich sicher. Aber echte Beweise können auch gegen einen sprechen.","mark":"O","epilog":""},"16":{"n":"16","title":"Die neue Kerze","paras":["Seit 20 Uhr. Abgebrannt sind 2 cm, dafür braucht die Kerze eine Stunde. Hätte sie seit sechs gebrannt, wäre sie nur noch 14 cm lang. Luigi kam also erst gegen acht nach Hause."],"trail":"Das aufgeschlagene Buch wirkt gemütlich, beweist aber nichts.","mark":"T","epilog":""},"17":{"n":"17","title":"Das Selfie mit der Turmuhr","paras":["Das Foto zeigt Viertel nach vier, nicht zwölf. Es ist zu einer anderen Zeit entstanden und beweist nichts über 12 Uhr. Mia hat ein altes Foto gezeigt."],"trail":"Der Cappuccino sieht frisch aus. Das sagt aber nichts über die Uhrzeit.","mark":"I","epilog":""},"18":{"n":"18","title":"Das Wechselgeld","paras":["10,70 €. Döner und Ayran kosten zusammen 9,30 €. 20 € minus 9,30 € sind 10,70 €. Ben hat recht, Can hat einen Euro zu wenig rausgegeben."],"trail":"9,70 € sieht fast aus wie der Preis, 9,30 €. Genau da hat Can sich vertan.","mark":"Z","epilog":""},"19":{"n":"19","title":"Brandts Einkaufszettel","paras":["Am KIOSK. Die Anfangsbuchstaben der Zeilen ergeben von oben nach unten das Wort."],"trail":"Kartoffeln, Oliven und Kürbis klingen nach Markt. Aber zum Markt geht Herr Brandt diesmal nicht.","mark":"B","epilog":""},"20":{"n":"20","title":"Ein Brötchen zu wenig","paras":["Eins. Die volle Tüte müsste 730 Gramm wiegen. Es fehlen 60 Gramm, also genau ein Brötchen."],"trail":"Die vollen Backen verraten Ben schon. Aber nur die Waage verrät, wie viele.","mark":"U","epilog":""},"21":{"n":"21","title":"Drei volle Milchflaschen","paras":["Drei Flaschen heißt: Mittwoch, Donnerstag und Freitag hat niemand die Milch reingeholt. Igor war seit Mittwochmorgen nicht zu Hause. Er kann den Mann am Mittwoch nicht vom Fenster aus gesehen haben."],"trail":"Die blaue Jacke klingt nach einem echten Hinweis, ist aber erfunden.","mark":"C","epilog":""},"22":{"n":"22","title":"Wer kam zuerst?","paras":["Anna. Die Reihenfolge ist Anna, Tom, Ben, Carla. Ben und Carla müssen direkt hintereinander kommen. Tom ist nicht Letzter und kommt nach Anna. Das passt nur, wenn Anna Erste und Tom Zweiter ist."],"trail":"Tom kam schon als Zweiter. Aber da war die Schale bereits leer.","mark":"H","epilog":""},"23":{"n":"23","title":"Der Samstagsbus","paras":["Emres. Den Bus um 17:40 Uhr gibt es nur von Montag bis Freitag. Samstags fährt die 7 um 17:20 und 17:50 Uhr."],"trail":"Luigis Pizzeria liegt direkt neben dem Kiosk. Nähe allein beweist nichts, und seine Gäste können ihn bestätigen.","mark":"E","epilog":""},"24":{"n":"24","title":"Brandts Postkarte","paras":["DER SCHLUESSEL LIEGT UNTER DEM ROTEN BLUMENTOPF. B wird zu E, also jeden Buchstaben drei Plätze zurückschieben: G wird D, H wird E, U wird R."],"trail":"Wer die Buchstaben vorwärts statt rückwärts schiebt, bekommt Unsinn.","mark":"S","epilog":""},"25":{"n":"25","title":"Kassensturz bei Kemal","paras":["Morgens 11, abends 7. Morgens: 11 × 2 € + 9 × 1 € = 31 €. Abends: 7 × 2 € + 13 × 1 € = 27 €. Der Dieb hat 4 Zwei-Euro-Münzen genommen und 4 Ein-Euro-Münzen hineingelegt, damit die Anzahl stimmt."],"trail":"„Es fehlen 4 Euro, also fehlen 4 Münzen.\" Nein, es sind ja noch genau 20.","mark":"G","epilog":""},"26":{"n":"26","title":"Vier Bestellungen an Tisch 4","paras":["Ali. Aus 1, 4 und 6: Falafel mit Wasser, Pide mit Tee, Lahmacun mit Cola, also Döner mit Ayran, und das ist Carla. Emre: keine Pide, kein Wasser, also Lahmacun mit Cola. Ben: keine Falafel, also Pide mit Tee. Für Ali bleiben Falafel und Wasser."],"trail":"Emre ist als Erster weg und wirkt verdächtig. Aber er trank Cola, kein Wasser.","mark":"E","epilog":""},"27":{"n":"27","title":"Wer hat den Roller genommen?","paras":["Ali. Dann stimmen Mias und Zeyneps Sätze, genau zwei. Wäre es Mia, wären drei Sätze wahr (Ali, Peter, Zeynep). Wäre es Peter, wäre keiner wahr. Wäre es Zeynep, nur ihrer."],"trail":"Zwei Leute zeigen auf Mia. Mehrheit ist aber kein Beweis.","mark":"S","epilog":""},"28":{"n":"28","title":"Die verflixten Gewürzdosen","paras":["Aus der Dose „gemischt\". Sie enthält nur eine Sorte. Schmeckt die Prise nach Chili, ist das die Chilidose. Die Dose „Pfeffer\" kann dann weder Pfeffer (Schild falsch) noch Chili (schon vergeben) enthalten, also ist sie gemischt. Bleibt „Chili\": Darin ist Pfeffer. Schmeckt es nach Pfeffer, gilt alles umgekehrt."],"trail":"Aus „Chili\" zu probieren hilft nicht: Findet man Pfeffer, weiß man nicht, ob die Dose nur Pfeffer oder gemischt enthält.","mark":"C","epilog":""},"29":{"n":"29","title":"Die alte SMS","paras":["An der BRÜCKE (BRUECKE). 22 = B, 777 = R, 88 = U, 33 = E, 222 = C, 55 = K, 33 = E."],"trail":"Wer jede Ziffer einzeln nimmt, bekommt nur Buchstabensalat.","mark":"H","epilog":""},"30":{"n":"30","title":"Kinokasse","paras":["Defne ist genau 16, Ayşe 48. In sechzehn Jahren ist Defne 32 und Ayşe 64, also doppelt so alt. Sie dürfen rein."],"trail":"Viele denken, Ayşe wolle schummeln. Diesmal stimmt alles.","mark":"A","epilog":""},"31":{"n":"31","title":"Anruf nach New York","paras":["In New York war es 3 Uhr nachts. Da sitzt niemand beim Mittagessen in der Firma. Dragans Telefonat ist erfunden."],"trail":"Ein Telefonat lässt sich prüfen, darum klingt es glaubwürdig. Aber erst rechnen, dann glauben.","mark":"H","epilog":""},"32":{"n":"32","title":"Die Uhr im Spiegel","paras":["Im Spiegel ist die Uhr seitenverkehrt. Was im Spiegel wie 9:40 aussieht, ist in Wirklichkeit 2:20 Uhr (oder 14:20 Uhr). Das Foto ist also um 2:20 Uhr entstanden und sagt nichts darüber, wo Can um 9:40 Uhr war."],"trail":"Das Foto ist echt und unbearbeitet. Es zeigt nur eine andere Uhrzeit, als Can glaubt.","mark":"N","epilog":""},"33":{"n":"33","title":"Das Zahlenschloss im Vereinsheim","paras":["697. Die 1 fällt weg: Bei 147 stünde sie richtig vorne, dann stünde sie auch bei 189 richtig, dort heißt es aber falsche Stelle. Wäre die 4 in der Mitte richtig, kann die 9 nicht dabei sein (laut 189 müsste sie vorne stehen, laut 964 steht sie dort falsch). Dann müssten aus 189 die 8 und aus 964 die 6 stimmen, und 286 hätte zwei richtige Ziffern statt einer. Also steht die 7 hinten, und die 4 fällt weg. Bei 964 stimmen dann 9 und 6, beide an falscher Stelle: Die 6 kann nicht in die Mitte, also steht vorne die 6 und in der Mitte die 9. Probe 189: Die 9 stimmt, steht dort hinten und gehört in die Mitte. Probe 286: Die 6 stimmt, steht hinten und gehört nach vorne."],"trail":"Die 8 taucht zweimal auf und wirkt wichtig. Sie ist gar nicht dabei.","mark":"A","epilog":""},"34":{"n":"34","title":"Kemals Spieße","paras":["Ja, 15 Minuten. Minute 0 bis 5: Spieß A und B, je Seite 1. Minute 5 bis 10: A Seite 2 und C Seite 1, B wartet. Minute 10 bis 15: B Seite 2 und C Seite 2. Der Grill ist nie halb leer."],"trail":"„Erst zwei fertig, dann der dritte\" dauert 20 Minuten, weil der Grill am Ende halb leer steht.","mark":"C","epilog":""},"35":{"n":"35","title":"Der Wasserfleck","paras":["Peter. Mia wohnt im 3. Stock, Greta im 5., Peter im 4., Igor im 2. Wohnte Mia im 2. Stock, wäre Greta im 4., Peter müsste in den 3. und Igor in den 5. Aber Peter wohnt höher als Igor. Das geht nicht."],"trail":"Greta wohnt auch über Mia, aber zwei Stockwerke höher. Ihr Wasser müsste erst durch Peters Wohnung.","mark":"H","epilog":""},"36":{"n":"36","title":"Der Silvester-Geburtstag","paras":["Ja, wenn er am 31. Dezember Geburtstag hat. Am 30.12. war er 9, am 31.12. wurde er 10. Dieses Jahr wird er am 31.12. 11, nächstes Jahr am 31.12. 12."],"trail":"Drei Jahre in zwei Jahren klingt unmöglich. Der Trick ist der Tag, an dem Tom es sagt.","mark":"Z","epilog":""},"37":{"n":"37","title":"Wem gehört der Hund?","paras":["Luigi. Zeynep wohnt im 4. Stock und hat die Katze, also wohnt der Hamster im 3. Stock. Der Papagei wohnt im 1., für den Hund bleibt der 2. Stock. Wer wohnt dort? Luigi wohnt direkt über Can, und Ayşe wohnt nicht im 1. Stock. Würde Can im 2. Stock wohnen, müsste Luigi im 3. wohnen und Ayşe im 1. Das geht nicht. Also wohnt Can im 1. Stock (Papagei), Luigi im 2. (Hund) und Ayşe im 3. (Hamster)."],"trail":"Ayşe wohnt direkt unter Zeynep und wirkt verdächtig. Aber sie hat nur einen Hamster, und in der Aufgabe steht: Es war der Hund.","mark":"E","epilog":""},"38":{"n":"38","title":"Bis zum Abspann","paras":["Nein. Der Film beginnt nach der Werbung um 20:35 Uhr und endet um 22:25 Uhr. Mit 5 Minuten Heimweg wäre Mia frühestens um 22:30 Uhr zu Hause gewesen. Mia ist früher gegangen und erzählt nur nicht, wohin."],"trail":"Wer 20:15 Uhr plus 1 Std. 50 Min. plus 5 Minuten Heimweg rechnet, landet genau bei 22:10 Uhr und glaubt Mia. Die Werbung vergisst man leicht.","mark":"H","epilog":""},"39":{"n":"39","title":"Sonnenuntergang auf der Zugspitze","paras":["Mitte Dezember geht die Sonne in Bayern schon gegen halb fünf unter. Um sieben ist es längst stockdunkel. Lars hat keinen Sonnenuntergang um sieben fotografiert."],"trail":"Auf einem Berg sieht man die Sonne etwas länger. Aber zweieinhalb Stunden länger? Nein.","mark":"N","epilog":""},"40":{"n":"40","title":"Die angebrannte Torte","paras":["Ayşe. Die Torte kam nicht mit dem Bus und nicht mit dem Fahrrad (das hatte der Salat), also mit dem Auto, und mit dem Auto kam Ayşe. Mehmet bringt kein Brot, also den Salat und kam mit dem Fahrrad. Luigi brachte das Brot mit dem Bus."],"trail":"Mehmet ist Bäcker, also tippen viele auf ihn. Aber er hat diesmal den Salat mitgebracht.","mark":"N","epilog":""},"41":{"n":"41","title":"Das letzte Stück Käsesahne","paras":["Ayşe hat das Stück gegessen, und Defne schwindelt. Würde Mehmet lügen, hätte auch Emre gelogen, denn Emre sagt, Mehmet sei ehrlich. Das wären zwei Schwindler. Also sind Mehmet und Emre ehrlich, und Mehmet war es nicht. Damit stimmt auch Ayşes Satz. Der einzige Schwindler muss Defne sein: „Mama war's nicht\" ist falsch. Defne wollte ihre Mutter schützen."],"trail":"Mehmet ist Bäcker und liebt Kuchen. Gerade deshalb tippen viele auf ihn.","mark":"A","epilog":""},"42":{"n":"42","title":"Der Weg zum Bäcker","paras":["Nein, 4 km/h. Bei 6 km braucht er hin 1 Stunde und zurück 2 Stunden: 12 km in 3 Stunden. Weil er viel länger langsam unterwegs ist, zieht das den Schnitt runter."],"trail":"4,5 ist der Mittelwert der beiden Zahlen, aber nicht der Durchschnitt der Geschwindigkeit.","mark":"C","epilog":""},"43":{"n":"43","title":"Drei Schalter, eine Lampe","paras":["Schalter 1 einschalten und ein paar Minuten warten. Dann Schalter 1 aus, Schalter 2 an und sofort hoch. Brennt die Lampe: Schalter 2. Aus, aber warm: Schalter 1. Aus und kalt: Schalter 3."],"trail":"Nur mit an und aus kann man drei Schalter nicht unterscheiden. Man braucht eine dritte Eigenschaft.","mark":"H","epilog":""},"44":{"n":"44","title":"Die Torte in acht Stücken","paras":["Zwei Schnitte über Kreuz von oben, dann ein Schnitt waagerecht durch die Mitte, quer durch die Höhe der Torte. Vier Stücke oben, vier unten."],"trail":"Drei Schnitte von oben ergeben höchstens sieben Stücke, und die sind nicht gleich groß.","mark":"A","epilog":""},"45":{"n":"45","title":"Die Kurtaxe","paras":["Nein. Zwei Personen und zwei Nächte wären 4 mal 3,50 €, also 14 €. Auf der Rechnung stehen nur 7 €, das ist genau eine Nacht zu zweit. Mehmet ist schon am Samstagmorgen abgereist und konnte am Abend längst wieder zu Hause sein."],"trail":"Die Rechnung ist echt, mit Stempel und allem. Sie beweist nur etwas anderes, als Mehmet glaubt.","mark":"C","epilog":""},"46":{"n":"46","title":"Das Abreißkalenderblatt","paras":["Wäre niemand in der Wohnung gewesen, stünde der Kalender noch auf Freitag. Jemand hat die Blätter für Freitag, Samstag und Sonntag abgerissen, zuletzt am Montag. Den Schlüssel hat nur Jonas. Er war also doch in der Wohnung, aus reiner Gewohnheit hat er die Blätter abgerissen."],"trail":"Ein Einbrecher reißt keine Kalenderblätter ab, und Spuren am Schloss gibt es keine.","mark":"H","epilog":""},"47":{"n":"47","title":"Das Scanner-Protokoll","paras":["Lars war um 10:03 und um 10:07 Uhr in der Bahnhofstraße. Für die Fahrt zum Rosenweg und zurück bräuchte er 30 Minuten, nicht 4. Er hat Gretas Paket nur gescannt, aber nie hingebracht."],"trail":"Das Protokoll sieht ordentlich aus, Zeile für Zeile. Gerade das macht es verdächtig.","mark":"T","epilog":""},"48":{"n":"48","title":"Das Burgverlies","paras":["Tür 1. Ist Kuno ehrlich, dann lügt Bodo. Gero und Kuno sind also verschieden, und Gero lügt. Lügt Kuno, dann ist Bodo ehrlich. Gero und Kuno sind also gleich, und Gero lügt auch. In beiden Fällen lügt Gero, also warten hinter Tür 1 keine Löwen. Wer Kuno und Bodo sind, bleibt offen. Für die Tür spielt es keine Rolle."],"trail":"Fast alle versuchen zuerst herauszufinden, wer von Kuno und Bodo lügt. Das geht gar nicht, und man braucht es auch nicht.","mark":"D","epilog":""},"49":{"n":"49","title":"Die Geheimschrift am Gartenzaun","paras":["IM BOOTSHAUS AM SEE. Obere Reihe: I B O S A S M E. Untere Reihe: M O T H U A S E. Abwechselnd gelesen: I, M, B, O, O, T, S, H, A, U, S, A, M, S, E, E."],"trail":"Rückwärts lesen oder Buchstaben verschieben bringt nur Salat. Der Schlüssel ist das Bild, nicht die Buchstaben.","mark":"I","epilog":""},"50":{"n":"50","title":"Der Schatten auf dem Foto","paras":["Das Foto ist am Morgen entstanden. Morgens steht die Sonne im Osten, der Schatten zeigt nach Westen und ist lang. Mittags steht die Sonne hoch im Süden, dann ist der Schatten kurz und zeigt nach Norden. Emres Schatten ist lang und zeigt nach Westen. Mit dem Auto konnte Emre bis zwölf längst wieder am See sein. Sein Foto ist kein Alibi."],"trail":"Das Foto ist echt, und Emre war wirklich am Aussichtspunkt. Nur die Uhrzeit stimmt nicht.","mark":"E","epilog":""},"51":{"n":"51","title":"Popcorn im Kino","paras":["Max. Säße Anna auf Platz 6, säße Tom auf Platz 5 (Hinweis 2). Carla müsste rechts von Tom sitzen (Hinweis 4), also auf Platz 6, und der ist besetzt. Also sitzt Anna auf Platz 1, Tom auf Platz 2 und Max auf Platz 4 (Hinweis 3). Frei sind noch 3, 5 und 6. Ben sitzt direkt rechts neben Lea, das geht nur mit Lea auf 5 und Ben auf 6. Carla sitzt also auf Platz 3, und rechts neben ihr, auf Platz 4, saß Max."],"trail":"Ben, der immer Hungrige, sitzt ganz am Rand. An den Eimer kam er gar nicht heran.","mark":"B","epilog":""},"52":{"n":"52","title":"Kemals Ayrankannen","paras":["In sechs Schritten. 1. Große Kanne füllen (5 und 0). 2. Damit die kleine füllen (2 und 3). 3. Kleine ausleeren (2 und 0). 4. Die 2 Liter in die kleine gießen (0 und 2). 5. Große wieder füllen (5 und 2). 6. Aus der großen die kleine voll machen, da passt nur noch 1 Liter hinein (4 und 3). In der großen Kanne sind genau 4 Liter."],"trail":"„Die große zu vier Fünfteln füllen\" klappt ohne Striche nicht. Ohne Striche gibt es nur ganz voll oder ganz leer.","mark":"S","epilog":""},"53":{"n":"53","title":"Blitz und Donner","paras":["Das Licht des Blitzes ist sofort da, der Donner braucht Zeit. Aus drei Kilometern dauerte es neun Sekunden, das hat Igor gezählt. Hans hat Blitz und Donner aber gleichzeitig wahrgenommen. Das geht nur, wenn man direkt neben der Kirche steht. Hans war nicht zu Hause, sondern am Kirchplatz."],"trail":"Dass Hans den Blitz gesehen hat, kann stimmen: Ein Blitz ist auch aus drei Kilometern gut zu sehen. Verräterisch ist nur der Donner.","mark":"C","epilog":""},"54":{"n":"54","title":"Ein wahrer und ein falscher Satz","paras":["Can, und die Krone liegt auf dem Dachboden. Wäre es Igor, wären beide Sätze von Mia wahr. Also war es nicht Igor, Mias zweiter Satz ist falsch und ihr erster wahr: Mia war es nicht. Wäre es Zeynep, wären beide Sätze von Can wahr. Also bleibt nur Can. Dann ist Zeyneps „Ich war's\" falsch, also stimmt „nicht im Garten\". Igors „Ich war's nicht\" stimmt, also ist „im Keller\" falsch. Bleibt der Dachboden. Can wollte für die Kinder eine Schatzsuche vorbereiten."],"trail":"Zeynep sagt „Ich war's\". Viele glauben ihr sofort. Aber das ist genau ihr falscher Satz.","mark":"H","epilog":""},"55":{"n":"55","title":"Der Weg durch die Stadt","paras":["Nur Luigi. Zeynep wäre frühestens um 10:02 Uhr am Kiosk, Kemal ebenfalls erst um 10:02 Uhr. Anna wäre um 9:59 Uhr am Kiosk, aber dann erst um 10:04 Uhr in der Bäckerei, eine Minute zu spät. Luigi: Bäckerei um 9:55 Uhr, Kiosk um 9:59 Uhr, um 10:00 Uhr der Griff in die Kasse, Bahnhof um 10:12 Uhr. Auf die Minute genau. Umwege helfen niemandem, jeder direkte Weg ist kürzer als ein Weg über einen dritten Ort."],"trail":"Anna war am nächsten dran und hätte es fast geschafft. Fast reicht nicht.","mark":"R","epilog":""},"56":{"n":"56","title":"Das Zahlengitter","paras":["AM BRUNNEN UM VIER. Das Gitter lautet Reihe 1: B R A N D. Reihe 2: T C E F G. Reihe 3: H I K L M. Reihe 4: O P Q S U. Reihe 5: V W X Y Z. Dann ist 13 = A, 35 = M, 11 = B, 12 = R, 45 = U, 14 = N, 23 = E und so weiter."],"trail":"Wer das Gitter einfach mit A, B, C beginnt, liest „CP ABUDDHD UP VMHB\". Ohne den Schlüssel geht es nicht.","mark":"E","epilog":""},"57":{"n":"57","title":"Der verstellte Fahrersitz","paras":["Peter. Mit 1,58 Metern kommt Mia bei ganz nach hinten geschobenem Sitz nicht an die Pedale, und ihr Sitzkissen liegt hinten. Die Kopfstütze ganz oben passt zu einem sehr großen Fahrer, und der riesige Schuhabdruck passt zu Größe 46, nicht zu 41. Mia wollte ihren Bruder schützen."],"trail":"Mia gibt die Tat sofort zu, und das klingt ehrlich. Aber wer etwas zugibt, hat es nicht automatisch getan: Man kann auch jemanden schützen.","mark":"I","epilog":""},"58":{"n":"58","title":"Die zwölf Kugeln","paras":["Erste Wägung: 1, 2, 3, 4 gegen 5, 6, 7, 8.","Fall A, die Waage bleibt gerade: Die falsche ist unter 9 bis 12, und 1 bis 8 sind echt. Zweite Wägung: 9, 10, 11 gegen 1, 2, 3. Bleibt sie gerade, ist es die 12. Dritte Wägung: 12 gegen 1 zeigt, ob sie schwerer oder leichter ist. Kippt die Waage, weißt du, ob die falsche unter 9, 10, 11 schwerer oder leichter ist. Dritte Wägung: 9 gegen 10. Die passende Seite ist die falsche, bleibt sie gerade, ist es die 11.","Fall B, die linke Seite ist schwerer: Dann ist eine von 1 bis 4 zu schwer oder eine von 5 bis 8 zu leicht, und 9 bis 12 sind echt. Zweite Wägung: 1, 2, 5 gegen 3, 6, 9.","Links schwerer: 1 oder 2 ist zu schwer, oder 6 ist zu leicht. Dritte Wägung: 1 gegen 2. Die schwerere ist es, bleibt sie gerade, ist die 6 zu leicht.","Rechts schwerer: 3 ist zu schwer oder 5 zu leicht. Dritte Wägung: 3 gegen 9. Ist die 3 schwerer, ist sie es, sonst ist die 5 zu leicht.","Gerade: 4 ist zu schwer, oder 7 oder 8 ist zu leicht. Dritte Wägung: 7 gegen 8. Die leichtere ist es, bleibt sie gerade, ist die 4 zu schwer.","Fall C, die rechte Seite ist schwerer: genauso wie Fall B, nur mit vertauschten Seiten."],"trail":"Sechs gegen sechs klingt gerecht, verschenkt aber eine ganze Wägung, weil man danach nicht weiß, ob die schwerere Seite eine schwere Kugel hat oder die leichtere eine leichte.","mark":"B","epilog":""},"59":{"n":"59","title":"Der Flohmarkt","paras":["Herr Sommer. Die Uhr kostet 20 Euro (1). Der Teddy kostet 5 Euro und liegt direkt links daneben (3). Stand 3 kostet 10 Euro, also stehen weder Uhr noch Teddy dort, und die Uhr steht nicht an Stand 4. Bleibt: Teddy an Stand 1, Uhr an Stand 2. Zeynep steht an 2 oder 3 (4). An Stand 2 kostet alles 20 Euro, da wäre sie nie billiger als Herr Sommer (6). Also steht Zeynep an Stand 3 mit 10 Euro und verkauft keine Lampe, also die Schallplatten. Die Lampe liegt an Stand 4 bei Dragan (2) für 15 Euro. Herr Sommer muss mehr als 10 Euro verlangen, also steht er an Stand 2 mit der Uhr. Oma Greta steht an Stand 1 mit dem Teddy."],"trail":"Oma Greta steht direkt neben der Uhr und kennt Oma Hilde gut. Sie verkauft aber nur einen Teddy.","mark":"T","epilog":""},"60":{"n":"60","title":"Die falschen Uhren","paras":["Kemal. Echte Zeit der Tat: 18:20 minus 10 Minuten, also 18:10 Uhr. Kemal: Zeyneps Uhr zeigte 18:15 Uhr, echt war es 18:30 Uhr. Von der Pizzeria um 18:10 Uhr zum Markt braucht er 10 Minuten, das passt locker. Mehmet: Bon um 18:12 Uhr, echt 18:08 Uhr. Um 18:10 Uhr kann er nicht an der Pizzeria gewesen sein, er bräuchte 5 Minuten. Mia saß von 18:05 bis 18:20 Uhr im Taxi. Kemal gibt es zu: Die Glocke bimmelt den ganzen Tag, er wollte endlich einmal Ruhe beim Grillen."],"trail":"Wer die Uhren nicht umrechnet, verdächtigt Mehmet: Bon um 18:12 Uhr plus 5 Minuten, und er wäre um 18:17 Uhr an der Pizzeria gewesen. Kemal dagegen scheint mit 18:15 Uhr plus 10 Minuten zu spät dran.","mark":"M","epilog":""},"61":{"n":"61","title":"Der Schrittzähler","paras":["Nein. 4.000 Schritte mal 75 Zentimeter sind 3.000 Meter, also 3 Kilometer. Drei Runden um den Block wären nur 900 Meter, das sind 1.200 Schritte. 3 Kilometer sind genau der Weg zum Marktplatz und zurück."],"trail":"Lars ist Paketbote und läuft den ganzen Tag viel. Aber die Uhr zeigt nur die Schritte zwischen 20:00 und 20:45 Uhr.","mark":"I","epilog":""},"62":{"n":"62","title":"Die drei Schließfächer","paras":["Wechseln! Seine erste Wahl war nur in 1 von 3 Fällen richtig. In den anderen 2 von 3 Fällen lag das Gold in Fach 2 oder 3, und der Moderator hat das leere davon geöffnet. Dann liegt das Gold im verbliebenen Fach. Wer wechselt, gewinnt also in 2 von 3 Fällen. Mit 100 Fächern sieht man es sofort: Das erste Fach hatte eine Chance von 1 zu 100. Das eine Fach, das der Moderator übrig lässt, hat den ganzen Rest."],"trail":"„Zwei Fächer, also fünfzig zu fünfzig.\" Das wäre richtig, wenn der Moderator zufällig öffnen würde. Er weiß aber, wo das Gold liegt. <b>Wusstest du?</b> Dieses Rätsel hat in den USA einmal eine riesige Leserbriefdebatte ausgelöst. Sogar Mathematiker lagen zuerst falsch.","mark":"T","epilog":""},"63":{"n":"63","title":"Der verschmierte Zettel","paras":["Ayşe. Wer mit rechts schreibt, hat die Hand rechts vom Stift, über dem leeren Papier. Wer mit links schreibt, zieht die Hand hinter dem Stift her, genau über die frische Tinte. Dabei verschmiert sie nach rechts. Nur Ayşe schreibt mit links. Sie gibt zu: In ihrem Zumbakurs friert sie seit Wochen."],"trail":"Hans ist für die Heizung zuständig und hätte den besten Grund, sich zu ärgern. Aber er würde sich kaum selbst einen Beschwerdezettel schreiben.","mark":"L","epilog":""},"64":{"n":"64","title":"Die Tombola","paras":["Oma Greta hat das Los genommen. Geschwindelt haben Greta und Luigi. Mehmet sagt, Luigi lügt: Von den beiden schwindelt also genau einer. Elif und Greta können nicht beide recht haben, also schwindelt auch von ihnen genau eine. Das sind schon zwei Schwindler, Kemal sagt die Wahrheit: Greta lügt. Dann sagt Elif die Wahrheit, Greta war es. Luigis „Elif lügt\" ist falsch. Greta hatte ihm einen Wellnesstag versprochen, wenn er dichthält."],"trail":"Greta zeigt auf Kemal, und der Satz klingt sehr bestimmt. Aber wer zuerst beschuldigt, ist nicht automatisch ehrlich.","mark":"I","epilog":""},"65":{"n":"65","title":"Der Tresor","paras":["8215. Aus 7 9 0 3 fallen 7, 9, 0 und 3 raus. Bei 3 2 1 0 bleiben nur 2 und 1, beide grün: Stelle 2 ist die 2, Stelle 3 die 1. Bei 1 7 4 0 ist die 1 das gelbe Lämpchen, also fällt auch die 4 raus. Bei 8 3 1 6 ist die 1 schon ein grünes Lämpchen, das zweite ist entweder die 8 vorne oder die 6 hinten. Bei 6 5 0 3 ist genau eine von 6 und 5 dabei. Wäre es die 6, müsste sie hinten stehen (vorne wäre sie bei 6 5 0 3 grün, die Mitte ist besetzt). Dann wäre bei 8 3 1 6 die 6 das zweite grüne Lämpchen, die 8 dürfte gar nicht dabei sein, und die 5 auch nicht. Für Stelle 1 bliebe keine Ziffer übrig. Also ist die 6 nicht dabei, die 8 steht vorne und die 5 ist dabei. Sie muss an Stelle 4 stehen."],"trail":"Die 3 kommt in vier von fünf Versuchen vor und wirkt wichtig. Sie ist gar nicht dabei.","mark":"N","epilog":""},"66":{"n":"66","title":"Die Brücke bei Nacht","paras":["Anna und Ben gehen hinüber (2 Minuten). Anna bringt die Lampe zurück (1 Minute, zusammen 3). Oma Hilde und Herr Brandt gehen hinüber (10 Minuten, zusammen 13). Ben bringt die Lampe zurück (2 Minuten, zusammen 15). Anna und Ben gehen hinüber (2 Minuten, zusammen 17)."],"trail":"„Anna ist die Schnellste, also bringt sie jedes Mal die Lampe zurück.\" Das dauert 19 Minuten, weil Oma Hilde und Herr Brandt dann einzeln laufen.","mark":"K","epilog":""},"67":{"n":"67","title":"Die Brosche von Oma Hilde","paras":["Zeynep. Um 15:00 Uhr war oben niemand, um 16:00 Uhr auch nicht. Zweimal Knarren heißt also: Eine Person ging um 15:20 Uhr hinauf und kam um 15:40 Uhr wieder herunter. Wären es zwei verschiedene Personen gewesen, wäre die erste um 16:00 Uhr noch oben. Z
